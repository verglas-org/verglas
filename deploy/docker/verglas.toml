# Minimal server config for the Docker self-host path.
# Mount over /etc/verglas/config.toml (see docker-compose.yml).
# Annotated reference: ../../verglas.example.toml

[listen]
s3_port = 8333
admin_port = 8334

[log]
format = "json"
level = "info"

[cache]
dir = "/var/lib/verglas"
capacity_bytes = "6TB"
dram_bytes = "1GB"

[backend]
provider = "s3"
bucket = "cascadelabs"
region = "auto"
endpoint = "https://856387ff129d6ed69bf6fc5abe57ab22.r2.cloudflarestorage.com"
credentials_file = "/etc/verglas/credentials/backend"

[auth]
credentials_file = "/etc/verglas/credentials/endpoint"

[catalog]
uri = "https://catalog.cloudflarestorage.com/856387ff129d6ed69bf6fc5abe57ab22/cascadelabs"
credentials_file = "/etc/verglas/credentials/catalog.token"
warehouse = "856387ff129d6ed69bf6fc5abe57ab22_cascadelabs"

[query_worker]
binary = "/usr/local/bin/verglas-query"

[write_worker]
binary = "/usr/local/bin/verglas-write"

# Optional Rill Developer integration. Start it with:
#   docker compose --profile analytics up -d
[analytics.rill]
uri = "http://rill:9009"
instance_id = "default"
browser_uri = "http://127.0.0.1:9009"
s3_uri = "http://verglas-server:8333"
