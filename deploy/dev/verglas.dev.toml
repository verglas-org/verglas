# Verglas cache-node config for the Cursor Cloud dev environment.
#
# Development config for `just run-dev`; point [backend] at a reachable S3-compatible origin.
# This is a development-only config: the origin and engine credentials are the
# local MinIO defaults and are generated at boot by start.sh. For a real backend,
# put credentials in the Secrets panel (injected as env vars) instead — the AWS
# env chain overrides backend.credentials_file.
#
# Annotated reference for every key: ../../verglas.example.toml

[listen]
s3_port = 8333
admin_port = 8334

[log]
format = "pretty"
level = "info"

[cache]
# start.sh creates this directory; it must be writable and exclusive to one node.
dir = "/tmp/verglas-dev/cache"
capacity_bytes = "1GB"
dram_bytes = "256MB"

[auth]
# Keypair engines present to Verglas on the S3 port (generated by start.sh).
credentials_file = "/tmp/verglas-dev/endpoint-creds"

[backend]
provider = "s3"
bucket = "my-bucket"
endpoint = "http://127.0.0.1:9000"
region = "us-east-1"
# The local MinIO origin speaks http; permit the plaintext endpoint.
allow_http = true
# Origin credentials (local MinIO defaults, generated by start.sh). The AWS env
# chain, if set, overrides this — that is how a real backend's Secrets take over.
credentials_file = "/tmp/verglas-dev/backend-creds"
