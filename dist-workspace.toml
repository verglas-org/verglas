[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist): the cross-platform prebuilt-binary release
# pipeline. `git tag vX.Y.Z && git push --tags` triggers .github/workflows/
# release.yml, which builds every target below, assembles one archive per
# engine roles, generates the installers, and publishes a
# GitHub Release with checksums. No crates.io publishing: the workspace patches
# iceberg from the verglas-org/iceberg-rust fork ([patch.crates-io]), so
# distribution is GitHub Releases only.
[dist]
# The dist version CI pins itself to, so releases are reproducible.
cargo-dist-version = "0.32.0"
# CI backend that runs the release workflow.
ci = "github"
# The CLI's one distribution channel: the npm installer publishes it as
# @verglas/cli, so `npx @verglas/cli` runs it with zero install. It downloads
# the per-target archives from the GitHub Release at install time, which is
# why those archives are still built and attached. Publishing needs the
# NPM_TOKEN repo secret.
installers = ["npm"]
npm-scope = "@verglas"
npm-package = "cli"
# Target platforms. musl is intentionally NOT built: aws-lc-sys (S3 TLS) and
# several native deps add musl-static friction. Linux ships glibc (gnu) instead,
# which covers the mainstream distros. windows-msvc is the real compile gate for
# the cfg-audited unix-only paths (service install, SIGHUP reload, process groups).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# SHA-256 checksum file alongside every archive.
checksum = "sha256"
# No release-plan job on PRs: releases are explicit tag pushes only.
pr-run-mode = "skip"
# Publish steps that run after every target build is green: the npm package
# for the CLI, the daemon container image (publish-docker.yml), the
# TypeScript SDK npm package (publish-sdk.yml), and the Rust SDK crates
# (publish-crates.yml).
publish-jobs = ["npm", "./publish-docker", "./publish-sdk", "./publish-crates"]
# Link the DYNAMIC MSVC CRT on windows. cargo-dist defaults to +crt-static,
# but the ONNX Runtime objects (fastembed -> ort, prebuilt) are compiled
# against the dynamic CRT — static linking fails with LNK2001 unresolved
# __imp_* symbols (seen on the v0.1.0 run). The UCRT ships with Windows 10+,
# so dynamic is safe for users.
msvc-crt-static = false
# Releases publish to this same public repo (verglas-org/verglas). No separate
# releases-only override.

