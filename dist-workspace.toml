[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist): the cross-platform prebuilt-binary release
# pipeline. `git tag vX.Y.Z && git push --tags` triggers .github/workflows/
# release.yml, which builds every target below, assembles one archive per target,
# generates the installers, and publishes a GitHub Release with checksums. No
# crates.io publishing: the workspace patches
# iceberg from the verglas-org/iceberg-rust fork ([patch.crates-io]), so
# distribution is GitHub Releases only.
[dist]
# The dist version CI pins itself to, so releases are reproducible.
cargo-dist-version = "0.32.0"
# CI backend that runs the release workflow.
ci = "github"
# Target platforms. musl is intentionally NOT built because the native TLS and
# object-store dependencies require a glibc-based Linux target. Linux ships glibc
# (gnu), which covers the mainstream distros.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# SHA-256 checksum file alongside every archive.
checksum = "sha256"
# No release-plan job on PRs: releases are explicit tag pushes only.
pr-run-mode = "skip"
# Link the dynamic MSVC CRT for the Windows native dependencies.
msvc-crt-static = false
# Releases publish to this same public repo (verglas-org/verglas). No separate
# releases-only override.
