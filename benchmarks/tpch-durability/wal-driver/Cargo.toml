[package]
name = "verglas-tpch-durability-wal-driver"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.60", features = ["derive"] }
hex = "0.4.3"
reqwest = { version = "0.12.28", default-features = false, features = ["http2", "rustls-tls"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time"] }
verglas-safekeeper = { path = "../../../crates/verglas-safekeeper" }
