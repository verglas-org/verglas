[package]
name = "lakekeeper-bin"
resolver = "2"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = """
This is Lakekeeper, a catalog for Iceberg tables.
"""

[[bin]]
name = "lakekeeper"
path = "src/main.rs"

[features]
default = ["kafka"]
kafka = ["dep:lakekeeper-events-kafka"]
open-api = [
    "lakekeeper-authz-openfga/open-api",
    "lakekeeper-authz-verglas/open-api",
    "lakekeeper/open-api",
]

[dependencies]
anyhow = { workspace = true }
# Cross-compiled image builds: azure/native-tls needs OpenSSL for the
# target; vendored compiles it from source instead of probing the host.
openssl-sys = { version = "0.9", features = ["vendored"] }
async-trait = { workspace = true }
cloudevents-sdk = { workspace = true }
clap = { version = "^4.5", features = ["derive"] }
figment = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
lakekeeper = { path = "../lakekeeper", features = ["s3-signer", "router"] }
lakekeeper-authz-openfga = { path = "../authz-openfga" }
lakekeeper-authz-verglas = { path = "../authz-verglas" }
lakekeeper-storage-verglas = { path = "../lakekeeper-storage-verglas" }
lakekeeper-events-kafka = { path = "../lakekeeper-events-kafka", optional = true }
lakekeeper-events-nats = { path = "../lakekeeper-events-nats" }
lakekeeper-secrets-kv2 = { path = "../lakekeeper-secrets-kv2" }
limes = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
tower = { workspace = true }
tikv-jemallocator = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { workspace = true, features = ["background_threads"] }

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
