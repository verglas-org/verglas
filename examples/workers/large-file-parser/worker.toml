spec_version = 1
name = "large-file-parser"
runtime = "python"
entrypoint = ["python", "worker.py"]

[files]
"pyproject.toml" = "@file:pyproject.toml"
"uv.lock" = "@file:uv.lock"
"worker.py" = "@file:worker.py"

[env]
INPUT_URL = "@secret:LARGE_FILE_URL"

[resources]
vcpus = 4.0
mem_mib = 8192
pids = 256
timeout_secs = 1800
