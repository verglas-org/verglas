[package]
name = "verglas-access-bin"
description = "Mandatory standalone Verglas authorization service"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "verglas-access"
path = "src/main.rs"

[[bin]]
name = "verglas-neon-bootstrap"
path = "src/neon_bootstrap.rs"

[dependencies]
axum.workspace = true
async-trait.workspace = true
clap.workspace = true
hex.workspace = true
hmac = "0.12.1"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-postgres = "0.7.13"
verglas-authz.workspace = true
verglas-authz-openfga.workspace = true
verglas-authz-postgres.workspace = true
verglas-container-runtime.workspace = true
verglas-database.workspace = true
verglas-rest.workspace = true
verglas-queue.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.dist]
dist = true
