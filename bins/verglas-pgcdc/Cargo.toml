[package]
name = "verglas-pgcdc-bin"
description = "The CDC worker binary: env-in / result-file-out, runs one pgoutput->Iceberg drain tick"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "verglas-pgcdc"
path = "src/main.rs"

[dependencies]
verglas-pgcdc.workspace = true
# The env-in / result-file-out worker contract (env const names, RunResult,
# CloudEvent) shared with the harness and the TS SDK's endpoint-run.
verglas-sdk.workspace = true
tokio.workspace = true
serde_json.workspace = true
# The Postgres pool the live PgSource drains through.
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
