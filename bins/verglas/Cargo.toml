[package]
name = "verglas"
description = "The Verglas CLI for developers and operators"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
verglas-core.workspace = true
# The data-plane verbs speak the server HTTP API (#323); verglas-sdk carries
# the report and tables_api wire types they deserialize and render.
verglas-sdk.workspace = true
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = "0.4.44"
thiserror.workspace = true
# The control-plane client reads the stored URL out of `~/.verglas/config.toml`
# and `verglas login` writes the `[control_plane]` section back into it.
toml.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# The browser login flow needs secure random bytes (PKCE verifier + OAuth state),
# a SHA-256 for the PKCE challenge, and base64url-no-pad encoding. Versions pinned
# to the ones already resolved in Cargo.lock so no other crate's lock entry moves.
getrandom = "0.2.17"
sha2 = "0.10.9"
base64 = "0.22.1"

[dev-dependencies]
reqwest.workspace = true
serde_json.workspace = true
chrono = "0.4.44"
tempfile.workspace = true
# Reads the endpoint keypair back out of the AWS-format creds file the dev
# config points at, asserting the file-based auth wiring (#216).
verglas-backend.workspace = true
# Reflects over the serialized default Config to assert the init scaffold covers
# every config field (#221).
toml.workspace = true
# The control-plane tests stand up a local mock of the control plane API so
# `verglas login` and `verglas deployments` are exercised end to end without
# ever contacting a real cloud endpoint.
axum.workspace = true

[lints]
workspace = true

# Ship this binary in the cargo-dist release archives (workspace packages set
# `publish = false` for the crates.io ban — the iceberg-rust fork patch forbids
# publishing — so dist would otherwise skip them). Distribution is GitHub
# Releases only; see dist-workspace.toml.
[package.metadata.dist]
dist = true
