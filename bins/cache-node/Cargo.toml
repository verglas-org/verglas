[package]
name = "verglas-cache-node"
description = "The standalone Verglas cache serving server: config + SigV4 S3 frontend + foyer cache tiers + origin read/write-through, and nothing else."
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "verglas-cache-node"
path = "src/main.rs"

[dependencies]
# The cache serving path, and nothing off it. No verglas-cluster (single-node
# rendezvous ring of one owns every key). The write crate supplies the EC
# catalog/object writeback journal used by strong-consistency cache nodes.
# There is still no platform/memory/query engine in this image.
verglas-core.workspace = true
verglas-cache.workspace = true
verglas-s3.workspace = true
verglas-backend.workspace = true
# Cache nodes own the tenant catalog response cache and watcher. Query workers
# consume the local gateway and never receive upstream Lakekeeper credentials.
verglas-catalog.workspace = true
verglas-tables.workspace = true
verglas-iceberg.workspace = true
# The block-device tier (#382): the NBD server in this binary serves cache-served
# virtual disks to attached NBD clients; verglas-block owns the durable chunk
# store + manifest.
verglas-block.workspace = true
# The block FLUSH write-back plane erasure-codes a device flush across the
# ring and acks on a quorum. It reuses the object tier's fragment store and peer
# RPC (verglas-cluster) — this binary wires the block ring peers to them and
# serves the fragment endpoints peers place shards through. The embedded
# safekeeper shares this transport; the object serving path stays a deliberate
# cluster-of-one.
verglas-cluster.workspace = true
verglas-consensus.workspace = true
# The Neon-compatible WAL listener is embedded in this process and places WAL
# fragments through the same ring transport as block FLUSH.
verglas-safekeeper.workspace = true
verglas-writeback.workspace = true
axum.workspace = true
futures.workspace = true
# The NBD listener needs the `io-util` AsyncRead/Write ext traits and `net`.
tokio = { workspace = true, features = ["io-util"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
bytes.workspace = true
tracing = "0.1.44"
# Same `[log]` subscriber shape as verglas-cache-node (json for pipelines, pretty for dev),
# minus the runtime reload handle the cache node has no admin route for.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2.3"
async-trait.workspace = true
hex.workspace = true
sha2.workspace = true
openraft.workspace = true
reqwest.workspace = true
object_store.workspace = true
iceberg.workspace = true
tempfile.workspace = true
thiserror.workspace = true
# Pin the process rustls CryptoProvider so an https origin (R2/S3) resolves TLS
# through a chosen provider rather than panicking when the dep graph carries more
# than one. Ring matches what reqwest's rustls-tls pulls in.
rustls = "0.23"
# The optional public S3 TLS listener (R6-A): terminates rustls per accepted
# connection by hand (not `axum::serve`'s `Listener` trait), so one slow
# handshake cannot stall accepting the next connection. `default-features =
# false` drops tokio-rustls's default `aws_lc_rs` backend so only the `ring`
# provider pinned in `main.rs` is linked in.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "service", "tokio"] }
# Draining in-flight TLS connections on shutdown before the process exits,
# mirroring `axum::serve(..).with_graceful_shutdown(..)`'s contract on the
# plaintext listener.
tokio-util = { version = "0.7", features = ["rt"] }
# `tower::ServiceExt::map_request` adapts the axum `Router` (a
# `Service<Request<axum::body::Body>>`) into the `Service<Request<Incoming>>`
# hyper-util's connection builder expects — the same adaptor `axum::serve`
# applies internally for the plaintext listener.
tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies]
# Generates the test CA + per-deployment leaf certificate the TLS listener
# tests hand to `tls::from_env`. `ring` matches the process crypto provider.
rcgen = { version = "0.14.9", default-features = false, features = ["ring", "pem"] }
reqwest.workspace = true
tempfile.workspace = true
toml.workspace = true
# Block-device tests: an in-memory object backend, and the NBD protocol test
# client drives the listener over a real loopback socket.

[lints]
workspace = true

# Not distributed as raw prebuilt binaries: the daemon ships as a container
# image (ghcr.io, built by the release pipeline's publish-docker job).
[package.metadata.dist]
dist = false
