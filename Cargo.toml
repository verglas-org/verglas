[workspace]
resolver = "2"
# One workspace for the whole repository. The Lakekeeper catalog crates live
# under `lakekeeper/crates/` and are members here — they are not a nested
# workspace. That became possible once both trees were put on a single
# `iceberg`: the fork in `[patch.crates-io]` below is the Lakekeeper base plus
# the Verglas commit constructor, so there is no longer one `iceberg` key
# wanted by two sources.
exclude = ["sdks/typescript"]
members = [
    "cli",
    "sdks/rust",
    "crates/verglas-backend",
    "crates/verglas-core",
    "crates/verglas-cluster",
    "crates/verglas-cache",
    "crates/verglas-instance",
    "crates/verglas-s3",
    "crates/verglas-catalog",
    "crates/verglas-tables",
    "crates/verglas-writeback",
    "crates/verglas-consensus",
    "crates/verglas-safekeeper",
    "crates/verglas-iceberg",
    "crates/verglas-graph",
    "crates/verglas-api",
    "crates/verglas-vector",
    "crates/verglas-kv",
    "bins/cache-node",
    "bins/query-node",
    "crates/verglas-block",

    # Lakekeeper catalog
    "lakekeeper/crates/authz-openfga",
    "lakekeeper/crates/authz-verglas",
    "lakekeeper/crates/iceberg-ext",
    "lakekeeper/crates/io",
    "lakekeeper/crates/lakekeeper",
    "lakekeeper/crates/lakekeeper-bin",
    "lakekeeper/crates/lakekeeper-events-kafka",
    "lakekeeper/crates/lakekeeper-events-nats",
    "lakekeeper/crates/lakekeeper-secrets-kv2",
    "lakekeeper/crates/lakekeeper-storage-verglas",
]

[workspace.package]
# RELEASE POLICY: bump this before every release tag; tags are immutable and
# are never deleted or re-pointed once pushed (the tag/version pair names the
# artifacts forever). The tag must match this version (cargo-dist enforces it).
#
# 0.2.0 marks absorbing the Lakekeeper catalog. Its crates were independently
# versioned at 0.13.1 under their own release-please; they now take this
# version like every other crate in the repository.
version = "0.2.0"
edition = "2024"
repository = "https://github.com/verglas-org/verglas"
homepage = "https://github.com/verglas-org/verglas"
# FSL-1.1-ALv2 is not an SPDX identifier, so crates that publish ship the
# license file itself.
license-file = "LICENSE"
# The Lakekeeper-derived crates inherit `license`; the engine crates inherit
# `license-file`. lakekeeper/LICENSING.md is authoritative for that subtree.
license = "Apache-2.0"
# Lakekeeper's declared MSRV. The repository pins 1.96.1.
rust-version = "1.94"
publish = false

[workspace.dependencies]
# Version alongside path: required for the crates.io publishes (verglas-api,
# verglas-core, verglas-sdk). The release version sweep must bump these too.
verglas-core = { path = "crates/verglas-core", version = "0.2.0" }
verglas-backend = { path = "crates/verglas-backend" }
verglas-cluster = { path = "crates/verglas-cluster" }
verglas-cache = { path = "crates/verglas-cache" }
verglas-instance = { path = "crates/verglas-instance" }
verglas-s3 = { path = "crates/verglas-s3" }
verglas-catalog = { path = "crates/verglas-catalog" }
verglas-tables = { path = "crates/verglas-tables" }
verglas-writeback = { path = "crates/verglas-writeback" }
verglas-consensus = { path = "crates/verglas-consensus" }
verglas-safekeeper = { path = "crates/verglas-safekeeper" }
verglas-iceberg = { path = "crates/verglas-iceberg" }
verglas-graph = { path = "crates/verglas-graph" }
verglas-api = { path = "crates/verglas-api", version = "0.2.0" }
verglas-vector = { path = "crates/verglas-vector" }
verglas-kv = { path = "crates/verglas-kv" }
verglas-block = { path = "crates/verglas-block" }
verglas-sdk = { path = "sdks/rust" }
tonic = "0.13.1"
prost = "0.13.5"
# Iceberg read/write and DataFusion integration shared by engine roles.
#
# All four are redirected by `[patch.crates-io]` to the Verglas fork, and all
# four must be, not just `iceberg`: the crates.io copies of the other three
# require `iceberg ^0.10.1` and would reject the patched one.
#
# The version reads backwards on purpose. 0.10.0 here is strictly newer than
# the 0.10.1 this used to be — upstream 0.10.1 is a patch release off the
# 0.10.0 line, while the fork now tracks upstream `main` past 0.10.0 and never
# took the 0.10.1 version bump. See the patch table at the bottom.
iceberg = "=0.10.0"
iceberg-catalog-rest = "=0.10.0"
iceberg-datafusion = "=0.10.0"
# S3/fs/memory storage backends for Iceberg FileIO. RestCatalog requires an
# explicit StorageFactory; the S3 one routes data-file writes and reads through
# the configured cache endpoint.
iceberg-storage-opendal = "=0.10.0"
# 54, not 53.1: the fork's `iceberg-datafusion` builds against DataFusion 54.
# Arrow stays on the 58 line across the bump, so the duckdb/arrow-array
# `RecordBatch` type identity noted below still holds.
datafusion = "54.0"
# bins/query-node's second query engine (protocol v4 step 9b): the bundled
# build statically links libduckdb so the binary carries its own engine, no
# system libduckdb at runtime. DuckDB's own Iceberg REST catalog support
# (its `iceberg`/`httpfs` extensions, loaded at session init) reads the same
# catalog and S3 endpoint the DataFusion path uses. Its `arrow` dependency
# pins to the same arrow-rs "58" line as the rest of the workspace, so
# `duckdb::arrow::record_batch::RecordBatch` and `arrow_array::RecordBatch`
# are the same type — query-node's JSON row writer serves both engines.
duckdb = { version = "1.10505.0", features = ["bundled"] }
# Arrow at the major version Iceberg 0.9 and DataFusion 52 build against.
arrow-array = "58"
arrow-buffer = "58"
arrow-ipc = "58"
arrow-schema = "58"
arrow-csv = "58"
arrow-json = "58"
arrow-cast = "58"
parquet = "58"
uuid = { version = "1.18", features = ["serde", "v4", "v5", "v7"] }
axum = "0.8.8"
bytes = "1.12.0"
async-trait = "0.1.89"
async-stream = "0.3.6"
foyer = "0.22.3"
# foyer's metrics registry trait (`mixtrics::RegistryOps`). foyer does not
# re-export it, so verglas names it directly to install a registry that reads
# foyer's `storage_queue_buffer_overflow` counter (#278). Pinned to the same
# version foyer 0.22.3 depends on so the trait objects are compatible.
mixtrics = "0.2.5"
futures = "0.3.31"
libc = "0.2.180"
object_store = { version = "0.14.0", features = ["aws", "azure", "gcp"] }
s3s = "0.14.1"
sync_wrapper = { version = "1.0.2", features = ["futures"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "rustls-tls-webpki-roots", "blocking", "stream", "http2"] }
# AWS SigV4 request signing for AWS-backed Iceberg REST catalogs (S3 Tables,
# Glue) — the watcher signs its own reqwest requests, no signing proxy (#236).
aws-config = { version = "1.8.10", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1.2", features = ["hardcoded-credentials"] }
aws-runtime = "1"
aws-sigv4 = "1.2"
aws-smithy-runtime-api = "1.8.7"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
serde_yaml = "0.9.34"
# SHA-256 content addressing for the block-device chunk store (verglas-block,
# #382): identical 2 MiB chunks hash to one key so they dedup across devices and
# versions. `hex` renders the digest as the backend object key.
sha2 = "0.10.9"
hex = "0.4.3"
# Tagged (de)serialization for iceberg's `Storage`/`StorageFactory` traits, which
# require `#[typetag::serde]` on every implementation.
typetag = "0.2.22"
# JSON Schema derived from the config structs' doc comments: the single source
# that feeds rustdoc, the generated config.toml, and a config reference page.
schemars = "1.0.4"
tempfile = "3.20.0"
thiserror = "2.0.18"
ts-rs = { version = "11.1.0", features = ["serde-compat"] }
chrono = "0.4.44"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.2"
xxhash-rust = { version = "0.8.16", features = ["xxh3"] }
# CRC32C (Castagnoli) for per-fragment integrity in the write-back tier (#220):
# hardware-accelerated (SSE4.2/ARM CRC) with a software fallback, the standard
# storage bit-flip detector, cheap on the fragment write path.
crc32c = "0.6.8"
# SIMD Reed-Solomon (Leopard, O(n log n)) for the write-back erasure codec (#180).
reed-solomon-simd = "3.1.0"
# Classic GF(2^8) Reed-Solomon, kept only for the codec throughput comparison
# benchmark (#180) that justifies the SIMD choice; not used on any serving path.
reed-solomon-erasure = "6.0.0"
openraft = { version = "0.9.24", features = ["serde", "storage-v2"] }
# Prometheus exposition (#46): a Registry + TextEncoder for the /metrics endpoint.
# The `process` feature is off — node-level process stats come from node-exporter,
# not this in-process registry (see verglas-core::metrics).
prometheus = { version = "0.14.0", default-features = false }
bollard = "0.21.0"
clap = { version = "4.5.60", features = ["derive", "env"] }

