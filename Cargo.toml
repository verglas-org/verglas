[workspace]
resolver = "2"
# One workspace for the runtime, product hosts, and retained Catalog support
# crates. The pinned Iceberg fork supplies the commit constructor used by the
# narrow runtime capability.
exclude = ["sdks/typescript"]
members = [
    "crates/verglas-backend",
    "crates/verglas-core",
    "crates/verglas-cache",
    "crates/verglas-s3",
    "crates/verglas-iceberg",
    "crates/verglas-do-turso",
    "crates/verglasd",
    "crates/verglas-runtime",
    "crates/verglas-do-wasm",
    "crates/verglas-gateway",
]

[workspace.package]
# RELEASE POLICY: bump this before every release tag; tags are immutable and
# are never deleted or re-pointed once pushed (the tag/version pair names the
# artifacts forever). The tag must match this version (cargo-dist enforces it).
#
# 0.2.0 marks the six-product Cloudflare-primitives runtime pivot.
version = "0.2.0"
edition = "2024"
repository = "https://github.com/verglas-org/verglas"
homepage = "https://github.com/verglas-org/verglas"
# FSL-1.1-ALv2 is not an SPDX identifier, so crates that publish ship the
# license file itself.
license-file = "LICENSE"
# The Catalog-derived crates inherit `license`; the engine crates inherit
# `license-file`. catalog/LICENSING.md is authoritative for that subtree.
license = "Apache-2.0"
# Catalog's declared MSRV. The repository pins 1.96.1.
rust-version = "1.94"
publish = false

[workspace.dependencies]
# Version alongside path is required for crates.io publishes of verglas-core.
# The release version sweep must bump it too.
verglas-core = { path = "crates/verglas-core", version = "0.2.0" }
verglas-backend = { path = "crates/verglas-backend" }
verglas-cache = { path = "crates/verglas-cache" }
verglas-s3 = { path = "crates/verglas-s3" }
verglas-iceberg = { path = "crates/verglas-iceberg" }
verglas-do-turso = { path = "crates/verglas-do-turso" }
verglas-do-wasm = { path = "crates/verglas-do-wasm" }
# Iceberg catalog, file I/O, and deterministic Sink writes. All retained crates
# are redirected by `[patch.crates-io]` to the same pinned Verglas fork.
iceberg = "=0.10.0"
iceberg-catalog-rest = "=0.10.0"
iceberg-storage-opendal = "=0.10.0"
arrow-array = "58"
arrow-schema = "58"
parquet = "58"
uuid = { version = "1.18", features = ["serde", "v4", "v5", "v7"] }
axum = "0.8.8"
bytes = "1.12.0"
async-trait = "0.1.89"
foyer = "0.22.3"
# foyer's metrics registry trait (`mixtrics::RegistryOps`). foyer does not
# re-export it, so verglas names it directly to install a registry that reads
# foyer's `storage_queue_buffer_overflow` counter (#278). Pinned to the same
# version foyer 0.22.3 depends on so the trait objects are compatible.
mixtrics = "0.2.5"
futures = "0.3.31"
libc = "0.2.180"
object_store = { version = "0.14.0", features = ["aws", "azure", "gcp"] }
s3s = "0.14.1"
sync_wrapper = { version = "1.0.2", features = ["futures"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "rustls-tls-webpki-roots", "blocking", "stream", "http2"] }
# Embedded Turso is the sole Durable Object database. Application transactions
# and WAL checkpoints remain serialized by the DO host.
turso = { version = "=0.7.2", default-features = false }
# AWS credential-chain support for object-store backends.
aws-config = { version = "1.8.10", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1.2", features = ["hardcoded-credentials"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
sha2 = "0.10.9"
hex = "0.4.3"
# Tagged (de)serialization for iceberg's `Storage`/`StorageFactory` traits, which
# require `#[typetag::serde]` on every implementation.
typetag = "0.2.22"
# JSON Schema derived from the config structs' doc comments: the single source
# that feeds rustdoc, the generated config.toml, and a config reference page.
schemars = "1.0.4"
tempfile = "3.20.0"
thiserror = "2.0.18"
# Component-model runtime for Durable Object Worker execution.
# Tenant Worker code is a WASM component targeting the verglas:do world; the
# host embeds Wasmtime rather than any JS engine.
wasmtime = { version = "48.0.0", default-features = false, features = [
    "component-model",
    "async",
    "runtime",
    "cranelift",
] }
wasmtime-wasi = { version = "48.0.0", default-features = false, features = ["p2"] }
wat = "1.238.0"
chrono = "0.4.44"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29.0"
toml = "1.1.2"
xxhash-rust = { version = "0.8.16", features = ["xxh3"] }
# Prometheus exposition (#46): a Registry + TextEncoder for the /metrics endpoint.
# The `process` feature is off — node-level process stats come from node-exporter,
# not this in-process registry (see verglas-core::metrics).
prometheus = { version = "0.14.0", default-features = false }

base64 = "0.22.1"
tower = { version = "^0.5" }

[workspace.lints.clippy]
# CI will run clippy with `-D warnings` (see `just lint`), turning these into errors.
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# VERGLAS PATCH: the iceberg crates from verglas-org/verglas-iceberg, branch
# `verglas/v0.10.0` — the lakekeeper/iceberg-rust base plus one added public
# constructor, `TableCommit::from_parts`. Apache upstream gates `TableCommit`
# construction to the transaction action set (fast-append + property updates,
# no overwrite or delete), so REPLACE commits cannot be built through the
# public API; compaction and post-compact snapshot expiry need that escape
# hatch.
#
# The base moved here from upstream's 0.10.1 tag to the Catalog fork so that
# this workspace and the catalog workspace under `catalog/` resolve ONE
# `iceberg`. While they disagreed, the two could never share a cargo workspace:
# one `[workspace.dependencies]` table admits one `iceberg` key, and a patch
# table cannot redirect a direct git dependency.
#
# The retained Iceberg crates are patched together and stay on the same rev.
#
# Pin a SHA — never a floating branch tip. Patch inventory:
# https://github.com/verglas-org/verglas-iceberg/blob/verglas/v0.10.0/VERGLAS.md
[patch.crates-io]
iceberg = { git = "https://github.com/verglas-org/verglas-iceberg", rev = "ae7972f56003c108afac91a4975aee6a55187887" }
iceberg-catalog-rest = { git = "https://github.com/verglas-org/verglas-iceberg", rev = "ae7972f56003c108afac91a4975aee6a55187887" }
iceberg-storage-opendal = { git = "https://github.com/verglas-org/verglas-iceberg", rev = "ae7972f56003c108afac91a4975aee6a55187887" }
# VERGLAS PATCH: foyer 0.22.3 from verglas-org/verglas-foyer, pinned by SHA.
# The runtime uses its bounded DRAM and NVMe stores only as local acceleration.
# Patch inventory:
# https://github.com/verglas-org/verglas-foyer/blob/verglas/v0.22.3/VERGLAS.md
foyer = { git = "https://github.com/verglas-org/verglas-foyer", rev = "58a7f001d8cd894423106713904daf948db20e65" }

# Carried over from the catalog workspace: proc-macro/build-script codegen is
# optimised so debug builds of the macro-heavy catalog crates stay tolerable.
[profile.dev.build-override]
debug-assertions = true
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
