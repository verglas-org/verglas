[workspace.lints.clippy]
# CI will run clippy with `-D warnings` (see `just lint`), turning these into errors.
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# VERGLAS PATCH: the iceberg crates from verglas-org/verglas-iceberg, branch
# `verglas/lakekeeper` — the Lakekeeper fork's base plus one added public
# constructor, `TableCommit::from_parts`. Apache upstream gates `TableCommit`
# construction to the transaction action set (fast-append + property updates,
# no overwrite or delete), so REPLACE commits cannot be built through the
# public API; compaction and post-compact snapshot expiry need that escape
# hatch.
#
# The base moved here from upstream's 0.10.1 tag to the Lakekeeper fork so that
# this workspace and the catalog workspace under `lakekeeper/` resolve ONE
# `iceberg`. While they disagreed, the two could never share a cargo workspace:
# one `[workspace.dependencies]` table admits one `iceberg` key, and a patch
# table cannot redirect a direct git dependency.
#
# All four crates are patched together and must stay on the same rev — the
# crates.io copies of the latter three require `iceberg ^0.10.1` and would
# reject the patched 0.10.0.
#
# Pin a SHA — never a floating branch tip. Patch inventory:
# https://github.com/verglas-org/verglas-iceberg/blob/verglas/lakekeeper/VERGLAS.md
[patch.crates-io]
iceberg = { path = "/Users/jfbrown/code/verglas-iceberg/crates/iceberg" }
iceberg-catalog-rest = { path = "/Users/jfbrown/code/verglas-iceberg/crates/catalog/rest" }
iceberg-datafusion = { path = "/Users/jfbrown/code/verglas-iceberg/crates/integrations/datafusion" }
iceberg-storage-opendal = { path = "/Users/jfbrown/code/verglas-iceberg/crates/storage/opendal" }
# VERGLAS PATCH: foyer 0.22.3 from verglas-org/verglas-foyer (branch
# verglas/v0.22.3) with live disk-resize for the block engine — the watermark
# model the write-pressure reclamation needs: shrink retires tail partitions
# and truncates the backing file, grow-back restores them. Pin a SHA — never
# a floating branch tip. Patch inventory:
# https://github.com/verglas-org/verglas-foyer/blob/verglas/v0.22.3/VERGLAS.md
foyer = { git = "https://github.com/verglas-org/verglas-foyer", rev = "58a7f001d8cd894423106713904daf948db20e65" }

# Carried over from the catalog workspace: proc-macro/build-script codegen is
# optimised so debug builds of the macro-heavy catalog crates stay tolerable.
[profile.dev.build-override]
debug-assertions = true
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Smallest-footprint profile for the standalone fleet cache image
# (bins/cache-node). The cache VM targets a 256 MB box, so its binary is built
# with fat LTO, a single codegen unit, size-optimized codegen, symbols stripped,
# and panic=abort (no unwinder — a cache node that panics should die and be
# restarted by the guest init, not unwind). Build with:
#   cargo build --profile min-size -p verglas-cache-node
[profile.min-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
