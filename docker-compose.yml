# Complete open-source Verglas development and community stack.
#
# 1. Export the managed R2 and client-facing S3 values required below.
# 2. Export the encryption, assertion, and scoped-token signing keys. Set the
#    first owner email once; it is not a continuing administrator bypass.
#    export VERGLAS_SECRET_ENCRYPTION_KEY="$(openssl rand -hex 32)"
#    export VERGLAS_TOKEN_SIGNING_KEY="$(openssl rand -base64 32)"
#    export VERGLAS_TARGET_JWT_SIGNING_KEY="$(openssl rand -base64 32)"
#    export VERGLAS_IDENTITY_ASSERTION_KEY="$(openssl rand -hex 32)"
#    export VERGLAS_INITIAL_OWNER_EMAIL="you@example.com"
# 3. docker compose up -d --build
# 4. Point the CLI at the admin port:
#      export VERGLAS_ENDPOINT=http://127.0.0.1:8334
#    Engines point S3 at http://127.0.0.1:8333 and Verglas OS is at
#    http://127.0.0.1:8787.

x-pg-cache-environment: &pg-cache-environment
  VERGLAS_ADMIN_ADDR: 0.0.0.0:8334
  VERGLAS_S3_ADDR: 0.0.0.0:8333
  VERGLAS_BLOCK_ADDR: 0.0.0.0:8335
  VERGLAS_RING_ADDR: 0.0.0.0:8336
  VERGLAS_RING_PEERS: cache-0=172.29.240.10:8336,cache-1=172.29.240.11:8336,cache-2=172.29.240.12:8336
  VERGLAS_CLUSTER_SECRET: ${VERGLAS_CLUSTER_SECRET:-verglas-local-ring}
  VERGLAS_SAFEKEEPER_ADDR: 0.0.0.0:5454
  VERGLAS_SAFEKEEPER_BROKER_ENDPOINT: http://verglas-neon-broker:50051
  VERGLAS_MANAGED_STORAGE_BUCKET: ${R2_BUCKET:?Set R2_BUCKET}
  VERGLAS_MANAGED_STORAGE_ENDPOINT: ${R2_ENDPOINT:?Set R2_ENDPOINT}
  VERGLAS_MANAGED_STORAGE_REGION: auto
  VERGLAS_MANAGED_STORAGE_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID}
  VERGLAS_MANAGED_STORAGE_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY}
  VERGLAS_S3_ACCESS_KEY_ID: ${VERGLAS_S3_ACCESS_KEY_ID:-verglas-local}
  VERGLAS_S3_SECRET_ACCESS_KEY: ${VERGLAS_S3_SECRET_ACCESS_KEY:?Set VERGLAS_S3_SECRET_ACCESS_KEY}
  VERGLAS_CACHE_CAPACITY: ${VERGLAS_POSTGRES_CACHE_CAPACITY:-1GB}
  VERGLAS_CACHE_DRAM: ${VERGLAS_POSTGRES_CACHE_DRAM:-256MB}

# The Verglas Lakekeeper adapter is not yet published to GHCR. Build the exact
# reviewed fork revision locally and never fall back to the upstream image.
x-lakekeeper-build: &lakekeeper-build
  context: https://github.com/verglas-org/lakekeeper.git#34fef9c4580369900211b21c0f1db95cf8f0a876
  dockerfile: docker/full.Dockerfile
  args:
    NO_CHEF: "true"

services:
  verglas-server:
    build:
      context: .
      target: verglas-server
    image: verglas/verglas-server:local
    ports:
      - "8333:8333" # S3 endpoint
      - "8334:8334" # admin API (CLI)
    environment:
      VERGLAS_ADMIN_ADDR: 0.0.0.0:8334
      VERGLAS_S3_ADDR: 0.0.0.0:8333
      VERGLAS_CACHE_DIR: /var/lib/verglas
      VERGLAS_CACHE_CAPACITY: ${VERGLAS_CACHE_CAPACITY:-20GB}
      VERGLAS_CACHE_DRAM: ${VERGLAS_CACHE_DRAM:-1GB}
      VERGLAS_BACKEND_BUCKET: ${R2_BUCKET:?Set R2_BUCKET}
      VERGLAS_BACKEND_ENDPOINT: ${R2_ENDPOINT:?Set R2_ENDPOINT}
      VERGLAS_BACKEND_REGION: auto
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY}
      VERGLAS_S3_ACCESS_KEY_ID: ${VERGLAS_S3_ACCESS_KEY_ID:-verglas-local}
      VERGLAS_S3_SECRET_ACCESS_KEY: ${VERGLAS_S3_SECRET_ACCESS_KEY:?Set VERGLAS_S3_SECRET_ACCESS_KEY}
      VERGLAS_QUERY_WORKER_BINARY: /usr/local/bin/verglas-query
      VERGLAS_WRITE_WORKER_BINARY: /usr/local/bin/verglas-write
      VERGLAS_SCHEDULER_URL: http://verglas-scheduler:8340
      VERGLAS_CONTAINER_RUNTIME_URL: http://verglas-container-runtime:8360
      VERGLAS_CONTAINER_RUNTIME_TOKEN: ${VERGLAS_CONTAINER_RUNTIME_TOKEN:-verglas-local-container-runtime}
      VERGLAS_ACCESS_URI: http://verglas-access:8345
      VERGLAS_ACCESS_TOKEN_FILE: /var/run/verglas/server/verglas-server.token
      VERGLAS_MANAGED_CATALOG_URI: http://verglas-lakekeeper:8181
    volumes:
      - ${VERGLAS_CACHE_HOST_DIR:-verglas-cache}:/var/lib/verglas
      - verglas-access-server-credentials:/var/run/verglas/server:ro
    # Contain a future socket or cache FD leak inside this service. Docker's
    # million-descriptor default is large enough to exhaust a desktop host.
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    restart: unless-stopped
    depends_on:
      verglas-access:
        condition: service_healthy

  verglas-access:
    build:
      context: .
      target: verglas-access
    image: verglas/verglas-access:local
    environment:
      VERGLAS_ACCESS_DATABASE_URL: postgres://verglas_internal:${POSTGRES_PASSWORD:-verglas}@verglas-system-postgres:55433/verglas_permissions
      VERGLAS_OPENFGA_ENDPOINT: http://verglas-openfga:8080
      VERGLAS_OPENFGA_STORE: verglas
      VERGLAS_OPENFGA_TOKEN: ${VERGLAS_OPENFGA_TOKEN:-verglas-local-openfga}
      VERGLAS_TENANT_ID: ${VERGLAS_TENANT_ID:-local}
      VERGLAS_INITIAL_OWNER_EMAIL: ${VERGLAS_INITIAL_OWNER_EMAIL:?Set VERGLAS_INITIAL_OWNER_EMAIL to the first tenant owner email}
      VERGLAS_TOKEN_SIGNING_KEY: ${VERGLAS_TOKEN_SIGNING_KEY:?Set VERGLAS_TOKEN_SIGNING_KEY to the base64 encoding of 32 random bytes}
      VERGLAS_TARGET_JWT_SIGNING_KEY: ${VERGLAS_TARGET_JWT_SIGNING_KEY:?Set VERGLAS_TARGET_JWT_SIGNING_KEY to the base64 encoding of a raw 32-byte Ed25519 seed}
      VERGLAS_IDENTITY_ASSERTION_KEY: ${VERGLAS_IDENTITY_ASSERTION_KEY:?Set VERGLAS_IDENTITY_ASSERTION_KEY to 64 hexadecimal characters}
      VERGLAS_SERVER_TOKEN_DIRECTORY: /var/run/verglas/server
      VERGLAS_LAKEKEEPER_TOKEN_DIRECTORY: /var/run/verglas/lakekeeper
      VERGLAS_NEON_TOKEN_DIRECTORY: /var/run/verglas/neon
      VERGLAS_SECRET_ENCRYPTION_KEY: ${VERGLAS_SECRET_ENCRYPTION_KEY:?Set VERGLAS_SECRET_ENCRYPTION_KEY to 64 hexadecimal characters}
      VERGLAS_ACCESS_LISTEN: 0.0.0.0:8345
      VERGLAS_MANAGED_CATALOG_URI: http://verglas-lakekeeper:8181
      VERGLAS_MANAGED_STORAGE_BUCKET: ${R2_BUCKET:?Set R2_BUCKET}
      VERGLAS_MANAGED_STORAGE_PREFIX: ${VERGLAS_TENANT_ID:-local}
      VERGLAS_MANAGED_STORAGE_ENDPOINT: http://verglas-cache-node-0:8333
      VERGLAS_MANAGED_STORAGE_REGION: auto
      VERGLAS_MANAGED_STORAGE_ACCESS_KEY_ID: ${VERGLAS_S3_ACCESS_KEY_ID:-verglas-local}
      VERGLAS_MANAGED_STORAGE_SECRET_ACCESS_KEY: ${VERGLAS_S3_SECRET_ACCESS_KEY:?Set VERGLAS_S3_SECRET_ACCESS_KEY}
      VERGLAS_CONTAINER_RUNTIME_URL: http://verglas-container-runtime:8360
      VERGLAS_CONTAINER_RUNTIME_TOKEN: ${VERGLAS_CONTAINER_RUNTIME_TOKEN:-verglas-local-container-runtime}
      VERGLAS_MANAGED_POSTGRES_SAFEKEEPERS: verglas-cache-node-0:5454
      VERGLAS_MANAGED_POSTGRES_CREDENTIAL_KEY: ${VERGLAS_SECRET_ENCRYPTION_KEY:?Set VERGLAS_SECRET_ENCRYPTION_KEY to 64 hexadecimal characters}
      VERGLAS_MANAGED_POSTGRES_TLS_CERTIFICATE_FILE: /var/lib/verglas-container-runtime/postgres-proxy/tls.crt
      VERGLAS_MANAGED_POSTGRES_TLS_PRIVATE_KEY_FILE: /var/lib/verglas-container-runtime/postgres-proxy/tls.key
      VERGLAS_MANAGED_POSTGRES_STORAGE_ENDPOINT: http://verglas-cache-node-0:8333
      VERGLAS_MANAGED_POSTGRES_STORAGE_BUCKET: ${R2_BUCKET:?Set R2_BUCKET}
      VERGLAS_MANAGED_POSTGRES_STORAGE_REGION: auto
      VERGLAS_MANAGED_POSTGRES_STORAGE_ACCESS_KEY_ID: ${VERGLAS_S3_ACCESS_KEY_ID:-verglas-local}
      VERGLAS_MANAGED_POSTGRES_STORAGE_SECRET_ACCESS_KEY: ${VERGLAS_S3_SECRET_ACCESS_KEY:?Set VERGLAS_S3_SECRET_ACCESS_KEY}
    volumes:
      - verglas-access-server-credentials:/var/run/verglas/server
      - verglas-access-lakekeeper-credentials:/var/run/verglas/lakekeeper
      - verglas-access-neon-credentials:/var/run/verglas/neon
      # The runtime creates the local proxy TLS identity before becoming
      # healthy. Access only reads it while creating an isolated proxy
      # container; it never receives the runtime's Docker authority.
      - verglas-runtime-state:/var/lib/verglas-container-runtime:ro
    ports:
      - "127.0.0.1:8345:8345"
    depends_on:
      verglas-neon-bootstrap:
        condition: service_completed_successfully
      verglas-queue-image:
        condition: service_completed_successfully
      verglas-openfga:
        condition: service_healthy
      verglas-container-runtime:
        condition: service_healthy
      verglas-cache-node-0:
        condition: service_healthy
      verglas-cache-node-1:
        condition: service_healthy
      verglas-cache-node-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8345/healthz"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  verglas-scheduler:
    build:
      context: .
      target: verglas-scheduler
    image: verglas/verglas-scheduler:local
    environment:
      VERGLAS_SCHEDULER_DATABASE_URL: postgres://verglas_internal:${POSTGRES_PASSWORD:-verglas}@verglas-system-postgres:55433/verglas_scheduler
      VERGLAS_WORKER_ENDPOINT: http://verglas-server:8334
      VERGLAS_SCHEDULER_QUEUE: local
      VERGLAS_SCHEDULER_LISTEN: 0.0.0.0:8340
      VERGLAS_SCHEDULER_CONTROL_TOKEN: ${VERGLAS_SCHEDULER_CONTROL_TOKEN:-verglas-local-scheduler}
      VERGLAS_CONTAINER_RUNTIME_URL: http://verglas-container-runtime:8360
      VERGLAS_CONTAINER_RUNTIME_TOKEN: ${VERGLAS_CONTAINER_RUNTIME_TOKEN:-verglas-local-container-runtime}
      VERGLAS_SECRET_ENCRYPTION_KEY: ${VERGLAS_SECRET_ENCRYPTION_KEY:?Set VERGLAS_SECRET_ENCRYPTION_KEY to 64 hexadecimal characters}
      VERGLAS_ACCESS_URI: http://verglas-access:8345
      VERGLAS_TENANT_ID: ${VERGLAS_TENANT_ID:-local}
    depends_on:
      verglas-server:
        condition: service_started
      verglas-access:
        condition: service_healthy
      verglas-container-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8340/healthz')"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  verglas-neon-bootstrap:
    build:
      context: .
      target: verglas-neon-bootstrap
    image: verglas/verglas-neon-bootstrap:local
    environment:
      VERGLAS_TENANT_ID: ${VERGLAS_TENANT_ID:-local}
      VERGLAS_CONTAINER_RUNTIME_URL: http://verglas-container-runtime:8360
      VERGLAS_CONTAINER_RUNTIME_TOKEN: ${VERGLAS_CONTAINER_RUNTIME_TOKEN:-verglas-local-container-runtime}
      VERGLAS_MANAGED_POSTGRES_STORAGE_ENDPOINT: http://verglas-cache-node-0:8333
      VERGLAS_MANAGED_POSTGRES_STORAGE_BUCKET: ${R2_BUCKET:?Set R2_BUCKET}
      VERGLAS_MANAGED_POSTGRES_STORAGE_REGION: auto
      VERGLAS_MANAGED_POSTGRES_STORAGE_ACCESS_KEY_ID: ${VERGLAS_S3_ACCESS_KEY_ID:-verglas-local}
      VERGLAS_MANAGED_POSTGRES_STORAGE_SECRET_ACCESS_KEY: ${VERGLAS_S3_SECRET_ACCESS_KEY:?Set VERGLAS_S3_SECRET_ACCESS_KEY}
      VERGLAS_MANAGED_POSTGRES_SAFEKEEPERS: verglas-cache-node-0:5454
      VERGLAS_MANAGED_POSTGRES_CREDENTIAL_KEY: ${VERGLAS_SECRET_ENCRYPTION_KEY:?Set VERGLAS_SECRET_ENCRYPTION_KEY to 64 hexadecimal characters}
      VERGLAS_SYSTEM_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verglas}
      VERGLAS_MANAGED_POSTGRES_CREDENTIAL_DIRECTORY: /var/lib/verglas-container-runtime/system-postgres
    volumes:
      - verglas-runtime-state:/var/lib/verglas-container-runtime
    depends_on:
      verglas-container-runtime:
        condition: service_healthy
      verglas-cache-node-0:
        condition: service_healthy
      verglas-cache-node-1:
        condition: service_healthy
      verglas-cache-node-2:
        condition: service_healthy
    restart: "no"

  verglas-queue-image:
    build:
      context: .
      target: verglas-queue-service
    image: verglas/verglas-queue-service:local
    entrypoint: ["/bin/true"]
    restart: "no"

  verglas-openfga-migrate:
    image: openfga/openfga:v1.18.1
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://verglas_internal:${POSTGRES_PASSWORD:-verglas}@verglas-system-postgres:55433/verglas_permissions?sslmode=disable
    depends_on:
      verglas-neon-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  verglas-openfga:
    image: openfga/openfga:v1.18.1
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://verglas_internal:${POSTGRES_PASSWORD:-verglas}@verglas-system-postgres:55433/verglas_permissions?sslmode=disable
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${VERGLAS_OPENFGA_TOKEN:-verglas-local-openfga}
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_LOG_FORMAT: json
    depends_on:
      verglas-openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:8081"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  verglas-lakekeeper-migrate:
    build: *lakekeeper-build
    image: &lakekeeper-image ghcr.io/verglas-org/lakekeeper:34fef9c4580369900211b21c0f1db95cf8f0a876
    pull_policy: never
    command: ["migrate"]
    environment: &lakekeeper-environment
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${VERGLAS_SECRET_ENCRYPTION_KEY:?Set VERGLAS_SECRET_ENCRYPTION_KEY to 64 hexadecimal characters}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgres://verglas_internal:${POSTGRES_PASSWORD:-verglas}@verglas-system-postgres:55433/verglas_catalog
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://verglas_internal:${POSTGRES_PASSWORD:-verglas}@verglas-system-postgres:55433/verglas_catalog
    depends_on:
      verglas-neon-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  verglas-lakekeeper:
    build: *lakekeeper-build
    image: *lakekeeper-image
    pull_policy: never
    command: ["serve"]
    environment:
      <<: *lakekeeper-environment
      LAKEKEEPER__AUTHZ_BACKEND: verglas
      LAKEKEEPER__VERGLAS__ENDPOINT: http://verglas-access:8345/
      LAKEKEEPER__VERGLAS__WORKLOAD_CREDENTIAL_FILE: /var/run/verglas/lakekeeper/verglas-lakekeeper.token
      LAKEKEEPER__VERGLAS__TENANT_ID: ${VERGLAS_TENANT_ID:-local}
      VERGLAS_CACHE_EVENT_URLS: ${VERGLAS_CACHE_EVENT_URLS:-http://verglas-server:8334/v1/events}
      VERGLAS_CACHE_EVENT_TOKEN: ${VERGLAS_CACHE_EVENT_TOKEN:-${VERGLAS_SCHEDULER_CONTROL_TOKEN:-verglas-local-scheduler}}
      VERGLAS_CACHE_CONSISTENCY: ${VERGLAS_CACHE_CONSISTENCY:-eventual}
    volumes:
      - verglas-access-lakekeeper-credentials:/var/run/verglas/lakekeeper:ro
    depends_on:
      verglas-lakekeeper-migrate:
        condition: service_completed_successfully
      verglas-access:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 2s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  verglas-cache-node-0:
    build:
      context: .
      target: verglas-cache-node
    image: verglas/verglas-cache-node:local
    environment:
      <<: *pg-cache-environment
      VERGLAS_NODE_ID: cache-0
      VERGLAS_SAFEKEEPER_ADVERTISE_ADDR: verglas-cache-node-0:5454
    volumes:
      - verglas-pg-cache-0:/var/lib/verglas
    networks:
      default:
      pg-ring:
        ipv4_address: 172.29.240.10
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8334/admin/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  verglas-cache-node-1:
    build:
      context: .
      target: verglas-cache-node
    image: verglas/verglas-cache-node:local
    environment:
      <<: *pg-cache-environment
      VERGLAS_NODE_ID: cache-1
      VERGLAS_SAFEKEEPER_ADVERTISE_ADDR: verglas-cache-node-1:5454
    volumes:
      - verglas-pg-cache-1:/var/lib/verglas
    networks:
      default:
      pg-ring:
        ipv4_address: 172.29.240.11
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8334/admin/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  verglas-cache-node-2:
    build:
      context: .
      target: verglas-cache-node
    image: verglas/verglas-cache-node:local
    environment:
      <<: *pg-cache-environment
      VERGLAS_NODE_ID: cache-2
      VERGLAS_SAFEKEEPER_ADVERTISE_ADDR: verglas-cache-node-2:5454
    volumes:
      - verglas-pg-cache-2:/var/lib/verglas
    networks:
      default:
      pg-ring:
        ipv4_address: 172.29.240.12
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8334/admin/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  verglas-container-runtime:
    build:
      context: .
      target: verglas-container-runtime
    image: verglas/verglas-container-runtime:local
    ports:
      - "127.0.0.1:8360:8360"
    environment:
      VERGLAS_CONTAINER_RUNTIME_LISTEN: 0.0.0.0:8360
      VERGLAS_CONTAINER_RUNTIME_TOKEN: ${VERGLAS_CONTAINER_RUNTIME_TOKEN:-verglas-local-container-runtime}
      VERGLAS_CONTAINER_RUNTIME_NETWORK: verglas-runtime
      VERGLAS_CONTAINER_RUNTIME_STATE: /var/lib/verglas-container-runtime/deployments.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - verglas-runtime-state:/var/lib/verglas-container-runtime
      - verglas-access-neon-credentials:/var/run/verglas/neon:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8360/health"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  verglas-agent-runtime:
    build:
      context: .
      target: verglas-agent-runtime
    image: verglas/verglas-agent-runtime:local
    ports:
      - "127.0.0.1:8390:8390"
    environment:
      DATABASE_URL: postgres://verglas_internal:${POSTGRES_PASSWORD:-verglas}@verglas-system-postgres:55433/verglas_scheduler
      VERGLAS_AGENT_RUNTIME_TOKEN: ${VERGLAS_AGENT_RUNTIME_TOKEN:-verglas-local-agent-runtime}
      VERGLAS_AGENT_RUNNER_IMAGE: verglas/verglas-agent-runtime:local
      VERGLAS_CONTAINER_RUNTIME_URL: http://verglas-container-runtime:8360
      VERGLAS_CONTAINER_RUNTIME_TOKEN: ${VERGLAS_CONTAINER_RUNTIME_TOKEN:-verglas-local-container-runtime}
      VERGLAS_RUNTIME_NETWORK: verglas-runtime
      VERGLAS_DATA_ENDPOINT: http://verglas-server:8334
      VERGLAS_ACCESS_URI: http://verglas-access:8345
      VERGLAS_TENANT_ID: ${VERGLAS_TENANT_ID:-local}
      LOCAL_MODEL_RUNTIME_URL: http://verglas-os:8790
      LOCAL_MODEL_RUNTIME_TOKEN: ${LOCAL_MODEL_RUNTIME_TOKEN:-verglas-local-model-runtime}
    depends_on:
      verglas-neon-bootstrap:
        condition: service_completed_successfully
      verglas-container-runtime:
        condition: service_healthy
      verglas-access:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8390/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  verglas-os:
    build:
      context: .
      target: verglas-os
    image: verglas/verglas-os:local
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      VITE_BACKEND_HOST: 0.0.0.0:8787
      VERGLAS_ADMIN_URL: http://verglas-server:8334
      VERGLAS_DATA_ENDPOINT: http://verglas-server:8334
      VERGLAS_SCHEDULER_URL: http://verglas-scheduler:8340
      VERGLAS_SCHEDULER_CONTROL_TOKEN: ${VERGLAS_SCHEDULER_CONTROL_TOKEN:-verglas-local-scheduler}
      VERGLAS_CONTAINER_RUNTIME_URL: http://verglas-container-runtime:8360
      VERGLAS_CONTAINER_RUNTIME_TOKEN: ${VERGLAS_CONTAINER_RUNTIME_TOKEN:-verglas-local-container-runtime}
      LOCAL_MODEL_RUNTIME_TOKEN: ${LOCAL_MODEL_RUNTIME_TOKEN:-verglas-local-model-runtime}
      LOCAL_MODEL_RUNTIME_HOST: 0.0.0.0
      CLAUDE_CONFIG_DIR: /root/.claude
      VERGLAS_AGENT_RUNTIME_URL: http://verglas-agent-runtime:8390
      VERGLAS_AGENT_RUNTIME_TOKEN: ${VERGLAS_AGENT_RUNTIME_TOKEN:-verglas-local-agent-runtime}
      VERGLAS_ACCESS_URI: http://verglas-access:8345
      VERGLAS_TENANT_ID: ${VERGLAS_TENANT_ID:-local}
      # run-dev-server derives the Workshop ADMINS binding from this value. Keep
      # it identical to the access service bootstrap owner so the local control
      # plane and tenant policy plane do not disagree about the first admin.
      VERGLAS_INITIAL_OWNER_EMAIL: ${VERGLAS_INITIAL_OWNER_EMAIL:?Set VERGLAS_INITIAL_OWNER_EMAIL to the first tenant owner email}
      VERGLAS_IDENTITY_ASSERTION_KEY: ${VERGLAS_IDENTITY_ASSERTION_KEY:?Set VERGLAS_IDENTITY_ASSERTION_KEY to 64 hexadecimal characters}
    volumes:
      - verglas-os-state:/workspace/apps/os/.wrangler/state
      - ${HOME}/.codex:/root/.codex
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.cursor:/root/.cursor
    depends_on:
      verglas-server:
        condition: service_started
      verglas-scheduler:
        condition: service_started
      verglas-container-runtime:
        condition: service_started
      verglas-access:
        condition: service_healthy
      verglas-agent-runtime:
        condition: service_healthy
    restart: unless-stopped

volumes:
  verglas-cache:
  verglas-runtime-state:
  verglas-os-state:
  verglas-access-server-credentials:
  verglas-access-lakekeeper-credentials:
  verglas-access-neon-credentials:
  verglas-pg-cache-0:
  verglas-pg-cache-1:
  verglas-pg-cache-2:

networks:
  default:
    name: verglas-runtime
    labels:
      io.verglas.managed: "true"
  pg-ring:
    name: verglas-pg-ring
    ipam:
      config:
        - subnet: 172.29.240.0/24
