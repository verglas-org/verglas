# Local engine-only stack. Hosted control-plane services live in verglas-cloud.
services:
  origin:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - verglas-origin:/data

  origin-init:
    image: minio/mc:latest
    depends_on:
      - origin
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://origin:9000 minioadmin minioadmin; do sleep 1; done
        mc mb --ignore-existing local/verglas

  cache:
    build:
      context: .
      target: verglas-cache-node
    depends_on:
      origin-init:
        condition: service_completed_successfully
    environment:
      VERGLAS_MANAGED_STORAGE_BUCKET: verglas
      VERGLAS_MANAGED_STORAGE_ENDPOINT: http://origin:9000
      VERGLAS_MANAGED_STORAGE_REGION: us-east-1
      VERGLAS_MANAGED_STORAGE_ALLOW_HTTP: "true"
      VERGLAS_MANAGED_STORAGE_ACCESS_KEY_ID: minioadmin
      VERGLAS_MANAGED_STORAGE_SECRET_ACCESS_KEY: minioadmin
      VERGLAS_S3_ACCESS_KEY_ID: ${VERGLAS_S3_ACCESS_KEY_ID:-verglas-local}
      VERGLAS_S3_SECRET_ACCESS_KEY: ${VERGLAS_S3_SECRET_ACCESS_KEY:-verglas-local-secret}
      VERGLAS_CACHE_CAPACITY: ${VERGLAS_CACHE_CAPACITY:-20GB}
      VERGLAS_CACHE_DRAM: ${VERGLAS_CACHE_DRAM:-1GB}
      VERGLAS_CATALOG_URI: ${VERGLAS_CATALOG_URI:-}
      VERGLAS_CATALOG_WAREHOUSE: ${VERGLAS_CATALOG_WAREHOUSE:-}
    ports:
      - "8333:8333"
      - "8334:8334"
    volumes:
      - verglas-cache:/var/lib/verglas

volumes:
  verglas-cache:
  verglas-origin:
