# Self-hosted Verglas cache server.
#
# 1. Copy deploy/docker/verglas.toml and fill [backend] (bucket/region/endpoint)
#    plus credentials under deploy/docker/credentials/ (see that directory).
# 2. docker compose up -d
# 3. Point the CLI at the admin port:
#      export VERGLAS_ENDPOINT=http://127.0.0.1:8334
#    Engines point S3 at http://127.0.0.1:8333.

services:
  verglas-server:
    build:
      context: .
      target: verglas-server
    image: verglas/verglas-server:local
    ports:
      - "8333:8333" # S3 endpoint
      - "8334:8334" # admin API (CLI)
    environment:
      VERGLAS_ADMIN_ADDR: 0.0.0.0:8334
      # Leave empty to run Verglas without worker scheduling. To enable the
      # optional workers profile, set this to http://verglas-scheduler:8340.
      VERGLAS_SCHEDULER_URL: ${VERGLAS_SCHEDULER_URL:-}
    volumes:
      - ./deploy/docker/verglas.toml:/etc/verglas/config.toml:ro
      - ./deploy/docker/credentials:/etc/verglas/credentials:ro
      - /Volumes/data_cache/verglas:/var/lib/verglas
    restart: unless-stopped

  verglas-scheduler:
    build:
      context: .
      target: verglas-scheduler
    image: verglas/verglas-scheduler:local
    environment:
      VERGLAS_SCHEDULER_DATABASE_URL: ${VERGLAS_SCHEDULER_DATABASE_URL:-}
      VERGLAS_SCHEDULER_VERGLAS_URL: http://verglas-server:8334
      VERGLAS_WORKER_ENDPOINT: http://verglas-server:8334
      VERGLAS_SCHEDULER_QUEUE: local
    depends_on:
      - verglas-server
    profiles:
      - workers
    restart: unless-stopped

  rill-volume-init:
    image: alpine:3.22
    command:
      - chown
      - -R
      - "1001:1001"
      - /var/lib/rill
    volumes:
      - rill-data:/var/lib/rill
    profiles:
      - analytics
    restart: "no"

  rill:
    image: rilldata/rill:v0.88.6
    platform: linux/amd64
    command:
      - start
      - /var/lib/rill
      - --no-open
      - --port
      - "9009"
    ports:
      - "9009:9009"
    volumes:
      - rill-data:/var/lib/rill
    depends_on:
      rill-volume-init:
        condition: service_completed_successfully
    profiles:
      - analytics
    restart: unless-stopped

volumes:
  rill-data:
