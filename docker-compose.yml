# One disposable OSS cache node. Catalog and object storage are provider-managed.
services:
  verglas:
    build:
      context: .
      target: verglas-cache-node
    environment:
      VERGLAS_PROVIDER: ${VERGLAS_PROVIDER:?set verglas-cloud, cloudflare, or aws-s3-tables}
      VERGLAS_STORAGE_BUCKET: ${VERGLAS_STORAGE_BUCKET:-}
      VERGLAS_STORAGE_ENDPOINT: ${VERGLAS_STORAGE_ENDPOINT:-}
      VERGLAS_STORAGE_REGION: ${VERGLAS_STORAGE_REGION:-us-east-1}
      VERGLAS_STORAGE_ALLOW_HTTP: ${VERGLAS_STORAGE_ALLOW_HTTP:-false}
      VERGLAS_STORAGE_ACCESS_KEY_ID: ${VERGLAS_STORAGE_ACCESS_KEY_ID:?set provider storage access key}
      VERGLAS_STORAGE_SECRET_ACCESS_KEY: ${VERGLAS_STORAGE_SECRET_ACCESS_KEY:?set provider storage secret}
      VERGLAS_CATALOG_URI: ${VERGLAS_CATALOG_URI:-}
      VERGLAS_CATALOG_WAREHOUSE: ${VERGLAS_CATALOG_WAREHOUSE:?set the provider warehouse identifier}
      VERGLAS_CATALOG_TOKEN: ${VERGLAS_CATALOG_TOKEN:-}
      VERGLAS_CATALOG_EVENT_TOKEN: ${VERGLAS_CATALOG_EVENT_TOKEN:-}
      VERGLAS_CATALOG_POLL_INTERVAL_SECONDS: ${VERGLAS_CATALOG_POLL_INTERVAL_SECONDS:-30}
      VERGLAS_S3_ACCESS_KEY_ID: ${VERGLAS_S3_ACCESS_KEY_ID:?set local cache S3 access key}
      VERGLAS_S3_SECRET_ACCESS_KEY: ${VERGLAS_S3_SECRET_ACCESS_KEY:?set local cache S3 secret}
      VERGLAS_CACHE_CAPACITY: ${VERGLAS_CACHE_CAPACITY:-20GB}
      VERGLAS_CACHE_DRAM: ${VERGLAS_CACHE_DRAM:-1GB}
      VERGLAS_ADMIN_ADDR: 0.0.0.0:8334
      VERGLAS_PUBLIC_S3_ENDPOINT: http://127.0.0.1:${VERGLAS_S3_HOST_PORT:-8333}
      VERGLAS_PUBLIC_ADMIN_URI: http://127.0.0.1:${VERGLAS_ADMIN_HOST_PORT:-8334}
    ports:
      - "${VERGLAS_S3_HOST_PORT:-8333}:8333"
      - "${VERGLAS_ADMIN_HOST_PORT:-8334}:8334"
    volumes:
      - ${VERGLAS_STATE_DIR:-./.verglas}:/var/lib/verglas
