# Workspace test profiles. All default tests use in-process fixtures; opt-in
# external-service tests are not part of the normal profile.
[profile.default]
failure-output = "immediate-final"
fail-fast = false
retries = 0

[profile.ci]
default-filter = "all()"
failure-output = "immediate-final"
fail-fast = false
retries = 0

[profile.ci.junit]
path = "junit.xml"
