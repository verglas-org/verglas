[package]
name = "verglas-tables"
description = "Iceberg and Parquet metadata parsing for format-aware caching"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
verglas-core.workspace = true
verglas-catalog.workspace = true
# The cache engine's evict-first demotion sink (#198): the retirement coordinator
# holds `Arc<dyn BlockDemoter>` to demote and hard-evict compaction-orphaned files.
verglas-cache.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
object_store.workspace = true
reqwest.workspace = true
# Decompress gzip-encoded catalog responses (some managed REST catalogs return
# Content-Encoding: gzip) so every local client receives plain JSON (#307/#310).
flate2 = "1.1"
# SigV4 signing for AWS-backed Iceberg REST catalogs (S3 Tables/Glue) (#236):
# the watcher signs its own reqwest requests directly (no signing proxy).
aws-config.workspace = true
aws-credential-types.workspace = true
aws-runtime.workspace = true
aws-sigv4.workspace = true
aws-smithy-runtime-api.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }
# Websocket transport for the catalog change feed (the second change-feed
# implementation after polling). rustls only, matching the workspace's reqwest
# rustls-tls choice — no native-tls / OpenSSL.
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
tracing = "0.1.44"
# Lock-free read path (arc-swap) and the fast hash for the hot-path maps.
arc-swap = "1.9"
rustc-hash = "2.1"
# Stable, fast hashing of partition tuples into the heat ledger's logical key
# (#51): the same hash must be computed identically by the request-path
# aggregator and the prefetch planner, so a fixed non-random hash is required.
xxhash-rust.workspace = true
# Iceberg manifests / manifest lists are Avro object containers; we parse them
# directly (see the iceberg-rust-vs-avro note in iceberg/mod.rs).
apache-avro = "0.20.0"
# Parquet footer parsing for column-chunk byte ranges. Metadata only: no arrow,
# no compression codecs are needed to read the footer thrift.
parquet = { version = "56", default-features = false }

[dev-dependencies]
axum.workspace = true
toml.workspace = true
tempfile.workspace = true
verglas-s3.workspace = true
futures.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "test-util",
] }
# Fixture generation writes real Parquet (via arrow) and real Avro files.
parquet = { version = "56", default-features = false, features = ["arrow", "snap"] }
arrow-array = "56"
arrow-schema = "56"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "classify"
harness = false

[[bench]]
name = "update"
harness = false

[lints]
workspace = true
