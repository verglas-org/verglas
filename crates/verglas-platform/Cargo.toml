[package]
name = "verglas-platform"
description = "Local verglas_sys worker/watermark/index registry (WHITEPAPER §7.1)"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
iceberg = "0.9.1"
# Arrow/Parquet for encoding and decoding the `verglas_sys` system-table rows.
# Pinned to the major versions iceberg 0.9 builds against, matching the
# workspace.
arrow-array = "57"
arrow-schema = "57"
parquet = "57"
futures = "0.3.31"
chrono = { version = "0.4.44", features = ["clock", "serde"] }
uuid = { version = "1.18", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
tracing = "0.1"

[dev-dependencies]
# The registry tests run against a hermetic SQLite-backed Iceberg catalog over a
# local-filesystem warehouse — no docker, no network.
iceberg-catalog-sql = "0.9.1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tempfile = "3.20.0"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
