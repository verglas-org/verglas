[package]
name = "verglas-ring-proxy"
description = "Pooled S3 and safekeeper ingress across one Verglas cache ring"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
axum.workspace = true
http = "1.4"
http-body-util = "0.1.3"
hyper = { version = "1.10", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "server", "tokio"] }
reqwest.workspace = true
sha2.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
