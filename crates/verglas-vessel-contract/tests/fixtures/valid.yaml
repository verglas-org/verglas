apiVersion: verglas.io/v1alpha1
kind: Vessel
name: hormuz-tracker
version: 1.0.0

integrations:
  - name: ais
    version: 2.1.0
    project: integrations/ais
    config:
      fields:
        - name: API_TOKEN
          label: AIS API token
          type: secret
          required: true
          help: Create a token in the provider console.
      setup:
        - title: Create an API token
          description: Generate a read-only token for live vessel positions.
          url: https://example.com/account/tokens

workers:
  - name: normalize-positions
    version: 1.3.0
    project: workers/normalize
    triggers:
      - event: maritime.ais.position
      - cron: "*/5 * * * *"
    grants:
      tables:
        - write: maritime.positions
      integrations:
        - ais

  - name: detect-transits
    version: 1.1.0
    project: workers/transits
    triggers:
      - table: maritime.positions
    grants:
      tables:
        - read: maritime.positions
        - write: maritime.transits

interface:
  name: tracker
  version: 3.0.0
  project: application
  port: 8380
  grants:
    tables:
      - read: maritime.positions
      - read: maritime.transits
    integrations:
      - ais
