[package]
name = "verglas-gateway"
description = "OSS Durable Object HTTP and WebSocket gateway"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Builds only the AC1 process-assembly helper around production runtime seams.
# This feature is never enabled by production gateway targets.
ac1-test-support = ["dep:verglas-do-turso", "dep:verglas-runtime"]

[dependencies]
async-trait.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
verglas-do-turso = { workspace = true, optional = true }
verglas-do-wasm.workspace = true
verglas-runtime = { path = "../verglas-runtime", optional = true }
bytes.workspace = true
futures.workspace = true
flate2.workspace = true
reqwest.workspace = true
hex.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
wasmtime.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[[bin]]
name = "verglas-runtime-test-support"
path = "src/bin/verglas-runtime-test-support.rs"
required-features = ["ac1-test-support"]

[[test]]
name = "ac1_integration"
path = "tests/ac1_integration.rs"
required-features = ["ac1-test-support"]

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite.workspace = true

[lints]
workspace = true
