[package]
name = "verglas-cache"
description = "Cache engine wrapper (hybrid memory + NVMe cache, foyer integration)"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The `ObjectRead`/`Invalidation` interfaces this engine implements live in core;
# no dependency on the protocol crate.
verglas-core.workspace = true
async-trait.workspace = true
bytes.workspace = true
# Default features only. foyer's `serde` feature installs a blanket
# `Code for T: Serialize` impl that would conflict with the manual `Code`
# impls in src/entry.rs — do not enable it anywhere in the workspace.
foyer.workspace = true
# foyer's metrics registry trait, used to surface foyer's silent
# `storage_queue_buffer_overflow` drops as a verglas counter and WARN (#278).
mixtrics.workspace = true
futures.workspace = true
thiserror.workspace = true
# Structured origin-fill-failure events (#61): a cold read whose origin GET/HEAD
# fails is logged with the request id and a redacted key hash, so a failure like
# #245/#233 is visible instead of degrading silently.
tracing = "0.1.44"
# The singleflight fill map (#19) runs each deduplicated fill in a detached
# task (waiter-cancellation safety) and shares its result across waiters —
# needs the tokio runtime handle for `spawn`.
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
