syntax = "proto3";

package storage_broker;

service BrokerService {
  rpc PublishSafekeeperInfo(stream SafekeeperTimelineInfo) returns (Empty);
}

message Empty {}

message TenantTimelineId {
  bytes tenant_id = 1;
  bytes timeline_id = 2;
}

// Wire-compatible subset of Neon's storage_broker contract. Field numbers are
// pinned to the Verglas Neon revision used by the Postgres image.
message SafekeeperTimelineInfo {
  uint64 safekeeper_id = 1;
  TenantTimelineId tenant_timeline_id = 2;
  uint64 last_log_term = 3;
  uint64 flush_lsn = 4;
  uint64 commit_lsn = 5;
  uint64 backup_lsn = 6;
  uint64 remote_consistent_lsn = 7;
  uint64 peer_horizon_lsn = 8;
  uint64 local_start_lsn = 9;
  string safekeeper_connstr = 10;
  optional string availability_zone = 11;
  uint64 term = 12;
  string http_connstr = 13;
  uint64 standby_horizon = 14;
  optional string https_connstr = 15;
}
