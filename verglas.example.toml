# verglas.example.toml — annotated reference configuration for `verglas-server`.
#
# Copy, edit, and pass with `verglas-server --config /etc/verglas/verglas.toml`.
# The file is validated at startup: a bad config makes the server exit
# non-zero with a message naming the exact field, and unknown fields are
# rejected so typos fail fast instead of silently taking defaults.
#
# Every field is optional and shown here with its default value.

[listen]
# Port of the S3 endpoint engines point at.
s3_port = 8333
# Port of the loopback admin API the `verglas` CLI talks to.
admin_port = 8334

# Virtual-hosted-style addressing (#11). Set the endpoint's base domain to accept
# `https://bucket.<domain>/key` alongside the always-supported path style
# `https://<domain>/bucket/key`. Optional: absent means path-style only, which is
# the local Docker default and works with any DNS setup.
#
# Virtual-hosted style in production requires wildcard DNS `*.<domain>` pointing
# at the L4 load balancer (NLB), so `bucket.<domain>` resolves for every bucket.
# Path style needs only `<domain>` itself to resolve — no wildcard.
#domain = "s3.example.com"

# TLS termination for the S3 endpoint (#11). Absent means plain HTTP — for local
# dev on localhost only. The production deployment puts an L4 NLB (TCP
# passthrough) in front of the servers, so TLS terminates HERE, at the server:
# the NLB never sees plaintext and SigV4's signed Host header survives intact.
#
# Point cert_path at the PEM certificate chain (leaf first) and key_path at the
# PEM private key. The server reloads both on SIGHUP without dropping live
# connections, so a production cert rotation causes zero failed requests: rotate
# the files on disk, then `kill -HUP <verglas-server-pid>`.
#[listen.tls]
#cert_path = "/etc/verglas/tls/fullchain.pem"
#key_path = "/etc/verglas/tls/privkey.pem"

# Structured logging (#61). The server installs one `tracing` subscriber from
# this section.
[log]
# Output format. `json` emits one JSON object per line for log pipelines
# (jq / CloudWatch / Loki); `pretty` emits human-readable lines for local
# diagnostics.
format = "json"
# Default verbosity filter, in RUST_LOG syntax (e.g. `info`, or a per-target
# filter like `verglas_cache=debug,info`). `RUST_LOG` in the environment
# overrides this at startup; `POST /admin/log {"level": "..."}` hot-reloads it
# at runtime without a restart.
level = "info"

[cache]
# Directory holding cached data. Must already exist and be writable by the
# server user.
dir = "/var/lib/verglas"
# Size ceilings. Byte fields take human-size strings — suffixes B/KB/MB/GB/TB
# (binary multiples) — or a bare number of bytes.
capacity_bytes = "20GB"   # on-disk cache
dram_bytes = "1GB"        # in-memory cache
# Data-cache fill/alignment geometry. The 2 MiB default matches typical
# DuckDB Parquet ranges; choose a power of two from 1MB through 8MB.
data_block_bytes = "2MB"

# TTL (seconds) for a *mutable* key->ETag mapping (#14): how long a mapping to a
# non-Iceberg object (the catalog pointer, arbitrary bucket objects) is trusted
# before a conditional `If-None-Match` revalidation against the origin. Immutable
# Iceberg files (*.parquet/*.orc/*.avro data, metadata/*.json) ignore this — their
# mappings are pinned indefinitely and never revalidate. 0 = revalidate every read.
mutable_mapping_ttl_secs = 5

# Scan-resistant admission (#15). A one-touch bulk read (a full-table scan
# larger than the cache) must not evict the frequently-reused working set, so
# once the cache is full a data block is admitted only after a compact
# frequency sketch has seen it `frequency_threshold` times. On by default; the
# whole table may be omitted to take these values. Metadata mappings (footers,
# manifests) bypass admission and are always cached — they are tiny and
# disproportionately valuable.
[cache.admission]
enabled = true            # false = admit every fetched block (debugging only)
frequency_threshold = 2   # admit on the second sighting (1 = admit everything)

# Snapshot-driven prefetch (#51). On a compaction (`replace`) commit the server
# prefetches the rewritten files' hot column chunks — scored against a heat
# ledger fed from the request path — so the cache hit rate recovers before
# queries re-earn it from the origin. Prefetch shares the warming byte budget and
# yields to organic traffic. On by default; the whole table may be omitted.
[cache.prefetch]
enabled = true            # false = the feature-flag-off baseline (lazy recovery)
concurrency = 32          # concurrent prefetch fill workers
footer_read_bytes = "64KB" # speculative footer window for added Parquet files
organic_yield_k = 32      # organic in-flight reads tolerated before prefetch yields
max_queue = 65536         # queued fills before the lowest-priority are dropped
heat_epoch_secs = 300     # heat-ledger EWMA epoch (5 minutes)
heat_table_cap = 65536    # bounded heat entries per table
heat_channel_capacity = 16384 # drop-on-full request-path sample channel depth

# SQL and logical writes execute in isolated role processes. The server only
# dispatches bounded requests; it contains no embedded query or table writer.
[query_worker]
binary = "/usr/local/bin/verglas-query"

[write_worker]
binary = "/usr/local/bin/verglas-write"

# Erasure-coded NVMe write-back tier (#180). OFF by default and disabled here.
# When enabled, a PUT to an opted-in key prefix is acked once `w` Reed-Solomon
# fragments (`k` data + `m` parity, any `k` reconstruct) are fsynced on `w`
# distinct live pod nodes, and the whole object is uploaded to the origin in the
# background. This is a DURABILITY CONTRACT CHANGE: during the lag between ack
# and origin upload the pod is the only copy of the object (as fragments), so
# losing more than `m` fragment nodes in that window is data loss. That is why it
# is opt-in per prefix. When the live pod cannot place `w` fragments (single
# node, small or degraded pod), the write falls back to synchronous
# write-through to the origin — today's durable-ack behavior — so a write is
# never acked sub-quorum and never rejected for cluster size. Iceberg ordering:
# wait for referenced data files to propagate (journal clean) before writing the
# commit (flush-before-commit).
[cache.writeback]
enabled = false           # master switch; off = zero write-path cost
k = 4                     # data fragments
m = 2                     # parity fragments
w = 5                     # fragments durable on distinct live nodes to ack;
                          # k <= w <= k+m. Post-ack node-loss tolerance is w-k.
ack_deadline_ms = 2000    # gather w durable fragments within this, else write-through
# k/m/w are the pod geometry for a multi-node deployment. A SINGLE-NODE
# deployment (no [cluster]) cannot form a fragment quorum, so with write-back
# enabled it fast-acks from LOCAL durability instead: the coding degenerates to
# k=1, m=0, w=1 — one fragment fsynced to local NVMe plus the fsynced journal is
# the ack, no origin round-trip on the write path, then background propagation to
# the origin exactly as the pod path does. This needs no configuration; k/m/w
# above are simply ignored on one node. Loss semantics, stated plainly: the
# durability of an acknowledged-but-unpropagated single-node write is one local
# disk until propagation completes — a dead disk before propagation loses those
# uncommitted files. COMMITTED table state is never affected: the commit barrier
# orders propagation before a table publishes, so the catalog never points at
# files missing from the origin. (The deployment story may put the buffer
# directory on a replicated block volume; the server neither knows nor relies on it.)
# There is no fragment size setting (#223): fragments share the one NVMe budget
# (cache.capacity_bytes) with the read cache, first come, first served.
# Fragments are transient — held only until the object propagates to the
# origin — so a write burst takes whatever budget the read cache is not using
# instead of degrading to write-through while the disk sits idle; once the
# budget (or the disk) is spent, writes degrade to synchronous write-through
# and reads keep serving. There is no size cap either: the encoder streams one
# stripe at a time, so the limit is NVMe headroom, not DRAM.
# The background scrubber walks stored fragments, verifies their CRC32C, and
# re-encodes any corrupt/missing one before faults accumulate past m. Its
# interval (cache.writeback.scrub_interval_secs) is an internal knob that keeps
# its 6 h default and is not surfaced here.
# Opt in specific key prefixes (longest match wins). With prefixes omitted and
# enabled = true, every key opts in at the geometry above.
# [[cache.writeback.prefixes]]
# prefix = "warehouse/db/hot/"
# k = 8                   # optional per-prefix geometry override
# m = 3
# w = 9

[backend]
# The buckets this server serves. It serves a SET: the single `bucket` below
# and/or the `bucket_globs` patterns. At least one of the two is REQUIRED — the
# server refuses to start without a bucket set. A request whose bucket is in the
# set is served; any other bucket returns NoSuchBucket. On a cache miss a served
# bucket is read through to its origin using the node's credential chain (the
# ambient AWS role/keys, or the credentials file below); one credential set
# covers the whole set.
#
# A single bucket (no s3:// prefix), the common case:
bucket = "my-bucket"
# Glob patterns naming a family of buckets (`*` matches any run of characters).
# Serves every AWS S3 Tables underlying bucket under one credential set:
#   bucket_globs = ["*--table-s3"]
bucket_globs = []

# The ceiling on concurrent in-flight origin requests, so a miss storm cannot
# exhaust the origin's connection pool. Defaults to 64.
max_concurrent_requests = 64

# Retry/backoff for transient origin failures (503 SlowDown, 500, 429,
# timeouts). Retries run *above* the concurrency limiter, so a request's
# backoff sleep releases its permit — a throttled origin never starves fresh
# fills. Non-retryable errors (403, 404, ...) return to the client at once.
[backend.retry]
max_retries = 3           # attempts after the first (0 disables retry)
initial_backoff_ms = 100  # first backoff; grows exponentially with jitter
max_backoff_ms = 3000     # ceiling on any single backoff
budget_ms = 10000         # total wall-clock budget for one request's retries

# Per-bucket circuit breaker. Sustained throttle/5xx failure opens it, shedding
# fill load for a cooldown so a struggling origin is not hammered; cache hits
# keep serving while it is open, misses fail fast with a clear error. It then
# half-opens to probe recovery.
[backend.breaker]
failure_rate = 0.5        # failure fraction over the window that trips it
min_samples = 20          # outcomes needed before the rate is trusted
cooldown_ms = 5000        # open duration before probing
half_open_max_probes = 3  # probe successes required to close again

# Static access keys engines present to the server's S3 endpoint. Optional:
# if the whole [auth] table is absent, the server generates a keypair at
# startup and prints it once.
#[auth]
#access_key_id = "dev"
#secret_access_key = "change-me"

# Iceberg REST catalog to watch for table commits. Optional: if the whole
# [catalog] table is absent, the Iceberg-awareness layer is off. Filters
# match the dotted `namespace.table` name with `*` wildcards; an empty
# `include` list means every table, and `exclude` always wins over `include`.
#[catalog]
#uri = "http://localhost:8181"   # base URI, before /v1/... (required)
#poll_interval_secs = 30         # seconds between polls (jitter added)
#include = []                    # e.g. ["analytics.*"]
#exclude = []                    # e.g. ["analytics.tmp_*"]
# Bearer mode: the file holds the token (mode 0600). SigV4 mode: an AWS-INI
# credentials file, same format as [backend]; unset uses the ambient AWS chain.
#credentials_file = "/etc/verglas/catalog-token"
#credentials_profile = "default" # SigV4 mode: profile inside credentials_file
# Sign catalog requests with SigV4 for AWS-hosted catalogs. Set both fields:
# S3 Tables uses signing name "s3tables", the Glue Iceberg REST endpoint "glue".
#sigv4_region = "us-west-2"
#sigv4_signing_name = "s3tables"
#warehouse = "lake"              # multi-warehouse catalogs; S3 Tables: the table-bucket ARN

# Gossip cluster membership (#27) and the weighted rendezvous ring (#28).
# Optional: if the whole [cluster] table is absent the server is a
# cluster-of-one — no gossip runs, the ring has one member, and behaviour is
# identical to a single-node deployment. When present, the node joins the pod
# over `chitchat` gossip and takes a weighted share of the keyspace.
#[cluster]
#id = "pod-west-1"                     # vector-index registry cluster id (default: hostname; VERGLAS_CLUSTER_ID overrides)
#pod_id = "default"                    # gossip cluster_id; nodes converge only within a pod
#node_id = "node-a"                    # stable identity (default: derived from hostname)
#gossip_addr = "10.0.0.1:7946"         # host:port this node binds/advertises for gossip (required)
#advertise_addr = "10.0.0.1:8333"      # host:port peers use to fetch bytes this node owns (#29 extension point)
#seeds = ["10.0.0.2:7946"]             # seed gossip addresses to contact on join (may be empty; DNS ok)
#weight = 800000000000                 # rendezvous weight (default: cache.capacity_bytes — capacity is the weight)
#suspicion_secs = 5                    # failure-detection window: a silent node is dropped within a small multiple
#warm_from_peers_secs = 300            # after joining, pull owned cold-miss blocks from their previous holder for this long (#30; 0 disables)
#drain_timeout_secs = 600             # `verglas drain` donor window before the node exits so the ring rebalances (#31)
