# Four-node Verglas ring over MinIO. This is the local evaluation harness for
# the offload work in #164: MinIO is the origin, and its Prometheus counters
# are the authoritative record of how many S3 PUTs the cluster issued.
#
# Bring it up with ./run.sh up. Do not point this at a real bucket.
name: verglas-perf

services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: verglas-local
      MINIO_ROOT_PASSWORD: verglas-local-secret
      # Unauthenticated scrape so the evaluator reads PUT counts without
      # holding a credential.
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the origin bucket once, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 verglas-local verglas-local-secret &&
             mc mb --ignore-existing local/verglas-test &&
             echo bucket-ready"

  node1: &node
    build:
      context: ../..
      target: verglas-cache-node
      args:
        CACHE_NS: perf
    depends_on:
      minio-init:
        condition: service_completed_successfully
    # The image entrypoint renders a config from VERGLAS_* env and creates the
    # cache directory. This harness mounts its own config, so it must create
    # that directory itself.
    entrypoint: ["sh", "-c", "mkdir -p /var/lib/verglas/cache && exec verglas-cache-node --config /etc/verglas/config.toml"]
    environment: &node_env
      VERGLAS_NODE_ID: node1
      # Distinct ports per listener. The safekeeper and block listeners both
      # default to 8335, so the ring plane needs its own.
      VERGLAS_SAFEKEEPER_ADDR: 0.0.0.0:8335
      # Same geometry as the write-back tier: tolerates one lost node of four.
      VERGLAS_SAFEKEEPER_EC_K: "2"
      VERGLAS_SAFEKEEPER_EC_M: "2"
      VERGLAS_SAFEKEEPER_EC_W: "3"
      VERGLAS_BLOCK_ADDR: 0.0.0.0:8336
      VERGLAS_RING_ADDR: 0.0.0.0:8337
      VERGLAS_RING_PEERS: node1=node1:8337,node2=node2:8337,node3=node3:8337,node4=node4:8337
      VERGLAS_CLUSTER_SECRET: verglas-local-ring-secret
      VERGLAS_ADMIN_ADDR: 0.0.0.0:8334
      VERGLAS_LOG_FORMAT: json
    volumes:
      - ./node1.toml:/etc/verglas/config.toml:ro
      - ./credentials/backend-r2:/etc/verglas/backend-r2:ro
      - ./credentials/endpoint:/etc/verglas/endpoint-credentials:ro
      - node1-state:/var/lib/verglas
    ports:
      - "18333:8333"
      - "18334:8334"
    cpus: "6"

  node2:
    <<: *node
    environment:
      <<: *node_env
      VERGLAS_NODE_ID: node2
    volumes:
      - ./node2.toml:/etc/verglas/config.toml:ro
      - ./credentials/backend-r2:/etc/verglas/backend-r2:ro
      - ./credentials/endpoint:/etc/verglas/endpoint-credentials:ro
      - node2-state:/var/lib/verglas
    ports:
      - "18343:8333"
      - "18344:8334"
    cpus: "6"

  node3:
    <<: *node
    environment:
      <<: *node_env
      VERGLAS_NODE_ID: node3
    volumes:
      - ./node3.toml:/etc/verglas/config.toml:ro
      - ./credentials/backend-r2:/etc/verglas/backend-r2:ro
      - ./credentials/endpoint:/etc/verglas/endpoint-credentials:ro
      - node3-state:/var/lib/verglas
    ports:
      - "18353:8333"
      - "18354:8334"
    cpus: "6"

  node4:
    <<: *node
    environment:
      <<: *node_env
      VERGLAS_NODE_ID: node4
    volumes:
      - ./node4.toml:/etc/verglas/config.toml:ro
      - ./credentials/backend-r2:/etc/verglas/backend-r2:ro
      - ./credentials/endpoint:/etc/verglas/endpoint-credentials:ro
      - node4-state:/var/lib/verglas
    ports:
      - "18363:8333"
      - "18364:8334"
    cpus: "6"

  # The Verglas fork of Lakekeeper, serving the Iceberg REST catalog over the
  # four nodes' CRaft ingress. This is the product under test: the catalog's
  # authoritative state lives in Verglas consensus, not PostgreSQL. Data files
  # written by an Iceberg client go to the Verglas S3 endpoint on node1, so
  # both the catalog path and the object path run through Verglas.
  lakekeeper:
    build:
      context: ../..
      dockerfile: tests/cluster-local/Dockerfile.lakekeeper
      args:
        CACHE_NS: perf
    depends_on:
      node1:
        condition: service_started
    command:
      - serve-craft
      - --endpoints
      - http://node1:8334,http://node2:8334,http://node3:8334,http://node4:8334
      - --tenant
      - local
      - --warehouse
      - lite
      - --managed-s3-profile
      - '{"bucket":"verglas-test","region":"us-east-1","endpoint":"http://node1:8333","path-style-access":true,"key-prefix":"warehouse"}'
    environment:
      # Credentials the catalog presents to the Verglas S3 endpoint for
      # metadata objects. These are the endpoint credentials, not MinIO's.
      AWS_ACCESS_KEY_ID: verglas-engine
      AWS_SECRET_ACCESS_KEY: verglas-engine-secret
      AWS_REGION: us-east-1
      LAKEKEEPER__BASE_URI: http://127.0.0.1:18181
      LAKEKEEPER__LISTEN_PORT: "8181"
      RUST_LOG: info
    ports:
      - "18181:8181"

  # Drives real Iceberg traffic: catalog operations to serve-craft, Parquet data
  # files to the Verglas S3 endpoint. Run on demand:
  #   docker compose run --rm workload
  workload:
    image: python:3.12-slim
    depends_on:
      lakekeeper:
        condition: service_started
    environment:
      CATALOG_URI: http://lakekeeper:8181/catalog
      S3_ENDPOINT: http://node1:8333
      MINIO_METRICS_URL: http://minio:9000/minio/v2/metrics/cluster
      WAREHOUSE: lite
      FILES: ${FILES:-50}
      ROWS: ${ROWS:-100}
    volumes:
      - ./catalog-workload.py:/w/catalog-workload.py:ro
    working_dir: /w
    entrypoint:
      - sh
      - -c
      - pip install --quiet "pyiceberg[s3fs]" pyarrow && python catalog-workload.py

volumes:
  node1-state:
  node2-state:
  node3-state:
  node4-state:
