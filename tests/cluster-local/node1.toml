# One node of the local four-node ring. Ring membership, node identity, and the
# cluster secret come from the environment (see docker-compose.yml); everything
# else is here.

[listen]
s3_port = 8333
admin_port = 8334

[log]
format = "json"

[cache]
dir = "/var/lib/verglas/cache"
capacity_bytes = "2GB"
dram_bytes = "256MB"

# The tier under test. k=2/m=2/w=3 tolerates one lost node on a four-node ring.
# An empty `prefixes` list opts every key in at this geometry, which is what the
# offload measurement wants: every PUT goes through write-back.
[cache.writeback]
enabled = true
k = 2
m = 2
w = 3
ack_deadline_ms = 2000

[backend]
provider = "s3"
bucket = "verglas-test"
bucket_globs = ["verglas-test"]
endpoint = "http://minio:9000"
region = "us-east-1"
allow_http = true
credentials_file = "/etc/verglas/backend-credentials"

# Required once the authoritative cache ring is enabled: the explicitly
# authorized namespace for consensus-committed catalog checkpoints. Catalog
# awareness is off in this harness, so nothing writes here during an
# object-path measurement.
[catalog_archive]
bucket = "verglas-test"
prefix = "_verglas/catalog"

[auth]
credentials_file = "/etc/verglas/endpoint-credentials"
