# s3-tests configuration for the Verglas conformance harness.
#
# The [s3 main] / [s3 alt] / [s3 tenant] sections all carry the SAME single dev
# keypair, because Verglas authenticates one static keypair (there is no
# multi-account model). s3-tests requires all three sections to exist, so they
# are present but identical; every test that depends on alt/tenant being a
# DISTINCT account (cross-account ACLs, policies, ownership) is on the skip list
# with that reason. host/port point at the local verglas-cache-node S3 endpoint; run.sh
# and the CI workflow override them via the generated copy when needed.
[DEFAULT]
host = 127.0.0.1
port = 8433
is_secure = False
ssl_verify = False

[fixtures]
bucket prefix = vgconf-{random}-
iam name prefix = s3-tests-
iam path prefix = /s3-tests/

[s3 main]
display_name = verglas-main
user_id = verglasmain
email = main@verglas.test
api_name = default
access_key = VGCONFORMANCEKEY
secret_key = vgconformancesecret0123456789abcd

[s3 alt]
display_name = verglas-alt
user_id = verglasalt
email = alt@verglas.test
access_key = VGCONFORMANCEKEY
secret_key = vgconformancesecret0123456789abcd

[s3 tenant]
display_name = verglas-tenant
user_id = verglastenant
email = tenant@verglas.test
access_key = VGCONFORMANCEKEY
secret_key = vgconformancesecret0123456789abcd
tenant = verglastenant

[iam]
access_key = VGCONFORMANCEKEY
secret_key = vgconformancesecret0123456789abcd
email = iam@verglas.test
user_id = verglasiam
display_name = verglas-iam

[iam root]
access_key = VGCONFORMANCEKEY
secret_key = vgconformancesecret0123456789abcd
account_id = RGW11111111111111111
user_id = RGW11111111111111111
email = root@verglas.test

[iam alt root]
access_key = VGCONFORMANCEKEY
secret_key = vgconformancesecret0123456789abcd
account_id = RGW22222222222222222
user_id = RGW22222222222222222
email = altroot@verglas.test
