# MinIO plays the capacity tier / origin bucket store for the conformance run.
# verglas-cache-node (the system under test) is NOT containerised: it is built from THIS
# repo and run as a local process by run.sh (mirroring `verglas dev`), so there
# is no Rust image to build and no libc/musl story to manage. Compose owns only
# the origin.
services:
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${VG_ORIGIN_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${VG_ORIGIN_SECRET_KEY:-minioadmin}
    ports:
      - "${VG_MINIO_PORT:-9100}:9000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
