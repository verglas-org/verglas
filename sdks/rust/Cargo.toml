[package]
name = "verglas-sdk"
description = "The Rust SDK for the agent-data platform: the worker/trigger contract, data-plane client, and tables_api wire types (#321)"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
verglas-api.workspace = true
verglas-core.workspace = true
arrow-array.workspace = true
arrow-buffer = "57"
arrow-schema.workspace = true
# Arrow IPC stream encoding for the data frames — the wire format connectors
# emit. Pinned to the workspace's Arrow major version.
arrow-ipc = "57"
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
reqwest.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }

[dev-dependencies]
axum.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
