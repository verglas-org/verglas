[package]
name = "verglas-sdk"
description = "The Rust SDK for the agent-data platform: data-plane client and tables_api wire types (#321)"
version.workspace = true
edition.workspace = true
repository.workspace = true
# Published to crates.io as the Rust SDK; overrides the workspace-wide
# publish = false (which exists because the engine crates depend on the
# patched Iceberg fork — this crate does not).
publish = true
license-file.workspace = true

[dependencies]
verglas-api.workspace = true
verglas-core.workspace = true
arrow-array.workspace = true
arrow-buffer = "58"
arrow-schema.workspace = true
# Arrow IPC stream encoding for the data frames — the wire format connectors
# emit. Pinned to the workspace's Arrow major version.
arrow-ipc = "58"
# CSV/JSONL schema inference and Parquet footer reads for client-side ingest
# (#145): the SDK owns the whole write path, no server round trip.
arrow-csv.workspace = true
arrow-json.workspace = true
arrow-cast.workspace = true
parquet.workspace = true
async-trait.workspace = true
async-stream = "0.3"
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
hex.workspace = true
hmac = "0.12.1"
# Direct Iceberg REST catalog + FileIO client for #145: create/append go
# straight to the catalog and object storage with vended credentials — no
# server-side file-ingest route in this path at all.
iceberg.workspace = true
iceberg-catalog-rest.workspace = true
iceberg-storage-opendal.workspace = true
percent-encoding = "2.3.2"
reqwest.workspace = true
serde = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
typetag.workspace = true
uuid.workspace = true
[dev-dependencies]
axum.workspace = true
futures.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
