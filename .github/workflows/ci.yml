name: ci

# Post-merge pushes to main deliberately do NOT build: every change lands via
# a PR that already ran this same job, so the merge run was a duplicate spend
# on billed private-repo minutes. Explicit runs: workflow_dispatch.
#
# Standing test policy (operator, 2026-08-03): tests must not have long waits
# and must not build or pull containers. External services are replaced with
# in-process mocks (the in-process S3 stub in
# crates/verglas-backend/tests/common/mod.rs is the pattern). Timing-dependent
# behavior waits on conditions with tight polls, never fixed sleeps. Anything
# that genuinely needs a real external service goes behind #[ignore] as an
# explicit opt-in, never in the default `cargo test` path.
on:
  pull_request:
  schedule:
    - cron: "0 7 * * *"        # 07:00 UTC nightly: the heavier coverage job
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The full-workspace test link once outgrew the runner (ld died with a bus
  # error mid-link). Debug info is the bulk of the target/ tree and of linker
  # memory, and CI never reads it — no debugger ever attaches here; a failed
  # test's backtrace still names symbols. Dropping it roughly halves link
  # inputs and disk, which is also what lets this job run WITHOUT the old
  # "free disk space" reclaim step now that MinIO/docker are gone from the
  # pipeline. Local builds are unaffected.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  sdk-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      # The TypeScript SDK includes an executable trajectory adapter whose
      # integration tests invoke the repository's supported Bun runtime.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Compare API, SDK, and docs surfaces
        run: node scripts/check-api-surface.mjs && bash scripts/check-cli-thin.sh

      - name: Test TypeScript SDK
        working-directory: sdks/typescript
        run: npm ci && npm run typecheck && npm test

  rust-changes:
    runs-on: ubuntu-latest
    outputs:
      has-packages: ${{ steps.packages.outputs.has-packages }}
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Package selection compares the pull request head with its merge
          # base. Both histories must be present for that comparison.
          fetch-depth: 0

      # rustup reads rust-toolchain.toml and installs the pinned toolchain,
      # so CI always matches dev machines exactly.
      - name: Install pinned toolchain
        run: rustup show

      - name: Format
        run: cargo fmt --all --check

      - name: Test package selection
        run: bash scripts/tests/changed-cargo-packages.sh

      - name: Select Cargo packages
        id: packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            packages="$(scripts/changed-cargo-packages.sh "$BASE_SHA" "$HEAD_SHA")"
          else
            packages="$(scripts/changed-cargo-packages.sh --all)"
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          if [[ "$packages" == "[]" ]]; then
            echo "has-packages=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-packages=true" >> "$GITHUB_OUTPUT"
          fi

  crate-tests:
    name: crate (${{ matrix.package }})
    needs: rust-changes
    if: needs.rust-changes.outputs.has-packages == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.rust-changes.outputs.packages) }}
    env:
      # sccache cannot cache incremental Rust compilation. CI jobs start from
      # clean runners, so reusable compiler results are the useful cache.
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show

      - name: Restore compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Each changed package owns one independent job. Clippy and tests share
      # that runner while sccache reuses unchanged dependency compilation from
      # previous workflow runs.
      - name: Lint ${{ matrix.package }}
        run: cargo clippy -p "${{ matrix.package }}" --all-targets -- -D warnings

      # No MinIO, docker, or external services (see the standing test policy
      # at the top of this file). Real-service mirrors remain explicit opt-ins.
      - name: Test ${{ matrix.package }}
        run: cargo test -p "${{ matrix.package }}"

  ci:
    # Keep one stable required-check name while the actual package checks are
    # a dynamic matrix whose labels vary with every pull request.
    if: always()
    needs: [rust-changes, crate-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require Rust gates
        env:
          CRATE_TESTS_RESULT: ${{ needs.crate-tests.result }}
          RUST_CHANGES_RESULT: ${{ needs.rust-changes.result }}
        run: |
          [[ "$RUST_CHANGES_RESULT" == "success" ]]
          [[ "$CRATE_TESTS_RESULT" == "success" || "$CRATE_TESTS_RESULT" == "skipped" ]]

  coverage:
    # Coverage is expensive (a full llvm-cov instrumented build). Run it
    # nightly and on demand only; run it locally before opening a PR. The cheap
    # lint+test `ci` job above is the default per-PR gate.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show && rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      # The backend fill test covering the per-bucket concurrency limiter's
      # per-operation guards runs against the in-process stub origin
      # (crates/verglas-backend/tests/fills.rs), so no MinIO here either.
      # The floor ratchets upward: when a PR raises overall coverage, it must
      # also raise this number to just below the new value (see AGENTS.md,
      # "Coverage"). Long-term target: >=90 lines.
      # (The Iceberg REST catalog service — verglas-catalog / verglas-catalogd —
      # moved to the verglas-cloud repo; the server is a catalog CLIENT only, so
      # nothing here stands up a catalog server.)
      - name: Coverage (fails under the floor)
        run: cargo llvm-cov --workspace --fail-under-lines 88 --lcov --output-path lcov.info

      - name: Coverage summary
        run: cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
