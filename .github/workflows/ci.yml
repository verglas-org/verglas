name: ci

# Post-merge pushes to main deliberately do NOT build: every change lands via
# a PR that already ran this same job, so the merge run was a duplicate spend
# on billed private-repo minutes. Explicit runs: workflow_dispatch.
#
# Standing test policy (operator, 2026-08-03): tests must not have long waits
# and must not build or pull containers. External services are replaced with
# in-process mocks (the in-process S3 stub in
# crates/verglas-backend/tests/common/mod.rs is the pattern). Timing-dependent
# behavior waits on conditions with tight polls, never fixed sleeps. Anything
# that genuinely needs a real external service goes behind #[ignore] as an
# explicit opt-in, never in the default `cargo test` path.
#
# One pipeline for the whole repository: format + lint + test, plus the
# coverage floor. No per-crate change detection or matrix — every PR runs the
# same workspace-wide gates a dev machine runs locally.
on:
  pull_request:
  schedule:
    - cron: "0 7 * * *"        # nightly rerun keeps the pin and cache warm
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The full-workspace test link once outgrew the runner (ld died with a bus
  # error mid-link). Debug info is the bulk of the target/ tree and of linker
  # memory, and CI never reads it — no debugger ever attaches here; a failed
  # test's backtrace still names symbols. Dropping it roughly halves link
  # inputs and disk. Local builds are unaffected.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  verglas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Repository boundary
        run: bash scripts/check-repository-boundary.sh

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: TypeScript SDK
        working-directory: sdks/typescript
        run: |
          npm ci
          npm test
          npm run typecheck

      - name: RIME plugin
        working-directory: rime
        run: |
          npm test
          npm pack --dry-run

  coverage:
    # The floor ratchets upward: when a PR raises overall coverage, it must
    # also raise this number to just below the new value (see AGENTS.md,
    # "Coverage"). Long-term target: >=90 lines.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show && rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Coverage summary
        if: always()
        run: cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

      - name: Enforce the floor
        run: cargo llvm-cov report --fail-under-lines 88
