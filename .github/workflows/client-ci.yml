name: client-ci

on:
  pull_request:
    paths:
      - "apps/os/**"
      - ".github/workflows/client-ci.yml"
  workflow_dispatch:

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/os/pnpm-lock.yaml

      - name: Install pinned dependencies
        run: pnpm --dir apps/os install --frozen-lockfile

      - name: Format
        env:
          CLIENT_QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CLIENT_QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm --dir apps/os format:check

      - name: Lint entire client
        run: pnpm --dir apps/os lint:check

      - name: Deny warnings in changed code
        env:
          CLIENT_QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CLIENT_QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm --dir apps/os lint:strict

      - name: Typecheck and reject unused code
        run: pnpm --dir apps/os types:check

      - name: Test
        run: pnpm --dir apps/os test

      - name: Build production client and Workers
        run: pnpm --dir apps/os build
