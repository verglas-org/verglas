name: Verglas OS release

on:
  pull_request:
    paths:
      - "apps/os/**"
      - ".github/workflows/os-release.yml"
  push:
    branches: [main]
    paths:
      - "apps/os/**"
      - ".github/workflows/os-release.yml"
  workflow_dispatch:

concurrency:
  group: verglas-os-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/os/pnpm-lock.yaml

      - name: Install OS dependencies
        run: pnpm --dir apps/os install --frozen-lockfile

      - name: Build OS frontend and Workers
        run: pnpm --dir apps/os build

      - name: Test OS release tooling
        run: pnpm --dir apps/os test

      - name: Build immutable release
        run: |
          release_id="r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:7}"
          node apps/os/scripts/release/build-release.mjs \
            --out release-out \
            --release-id "$release_id"

      - name: Preserve self-contained release
        uses: actions/upload-artifact@v4
        with:
          name: verglas-os-${{ github.run_number }}-${{ github.sha }}
          path: release-out/
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable release to R2
        if: github.event_name != 'pull_request'
        env:
          R2_ENDPOINT: https://856387ff129d6ed69bf6fc5abe57ab22.r2.cloudflarestorage.com
          R2_BUCKET: verglas-fleet-releases
          R2_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
        run: node apps/os/scripts/release/upload-release.mjs --release release-out
