# Publishes the TypeScript SDK (@verglas/sdk) to npm as part of a release.
#
# Called by the dist-generated release.yml ("./publish-sdk" in
# dist-workspace.toml's publish-jobs) after every target build is green, so a
# broken build can never publish an SDK version. Uses the repository's NPM_TOKEN
# secret for the package publish.

name: Publish TypeScript SDK

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      # The package ships the repository license; npm's "files" cannot reach
      # outside the package directory, so copy it in before packing.
      - run: cp ../../LICENSE .
      - run: npm ci
      - run: npm test
      # prepublishOnly runs the tsup build, so publish ships dist/ + types.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
