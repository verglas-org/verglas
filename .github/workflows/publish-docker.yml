# Publishes the daemon container image as part of a release.
#
# Called by the dist-generated release.yml ("./publish-docker" in
# dist-workspace.toml's publish-jobs) after every target build is green. The
# daemon is distributed only as this image — the raw verglas-cache-node
# binary is not attached to releases.
#
# Builds the root Dockerfile natively per architecture (no QEMU: a Rust
# release build under emulation takes hours) and stitches the two digests
# into one multi-arch manifest:
#   ghcr.io/verglas-org/verglas-cache-node:<version>
#   ghcr.io/verglas-org/verglas-cache-node:latest

name: Publish container image

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

env:
  IMAGE: ghcr.io/verglas-org/verglas-cache-node

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push each architecture by digest only; the merge job below owns tags.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: verglas-cache-node
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The release version comes from the dist plan (the announcement tag,
      # e.g. "v0.1.1"), not from git describe on a detached checkout.
      - name: Create multi-arch manifest
        run: |
          version="$(echo "$PLAN" | jq --raw-output '.announcement_tag')"
          version="${version#v}"
          tags="--tag ${IMAGE}:${version} --tag ${IMAGE}:latest"
          digests=""
          for digest in /tmp/digests/*; do
            digests="${digests} ${IMAGE}@sha256:$(basename "$digest")"
          done
          docker buildx imagetools create ${tags} ${digests}
          docker buildx imagetools inspect "${IMAGE}:${version}"
        env:
          PLAN: ${{ inputs.plan }}
